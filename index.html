<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Controle de Estoque</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;font-size:14px}
header{background:#fff;border-bottom:1px solid #e5e5e5;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
header h1{font-size:15px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:16px 24px 0}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:12px 16px}
.card .num{font-size:26px;font-weight:600;margin-bottom:2px}
.card .lbl{font-size:11px;color:#888}
.card.critico .num{color:#dc2626}.card.atencao .num{color:#d97706}.card.ok .num{color:#16a34a}
.panel{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:18px 20px;margin:16px 24px 0}
.panel-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.panel-header h3{font-size:13px;font-weight:600;color:#444;margin:0}
.period-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.period-bar .pbtn{padding:4px 10px;border-radius:6px;border:1px solid #e5e5e5;background:#fff;font-size:12px;cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap}
.period-bar .pbtn:hover{background:#f0eeff;border-color:#7c7af8;color:#7c7af8}
.period-bar .pbtn.active{background:#7c7af8;color:#fff;border-color:#7c7af8}
.period-bar .custom-range{display:none;align-items:center;gap:4px;font-size:12px}
.period-bar .custom-range.open{display:flex}
.origin-bar{display:flex;gap:6px;align-items:center}
.origin-bar .obtn{padding:4px 12px;border-radius:6px;border:1px solid #e5e5e5;background:#fff;font-size:12px;cursor:pointer;font-weight:500;transition:.15s}
.origin-bar .obtn:hover{background:#f0eeff;border-color:#7c7af8}
.origin-bar .obtn.active{background:#7c7af8;color:#fff;border-color:#7c7af8}
.origin-bar .obtn.ful.active{background:#f59e0b;border-color:#f59e0b}
.origin-bar .obtn.norm.active{background:#16a34a;border-color:#16a34a}
.top-bar{padding:12px 24px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.table-wrap{padding:12px 24px 32px;overflow-x:auto}
table{width:100%;background:#fff;border-radius:10px;border:1px solid #e5e5e5;border-collapse:separate;border-spacing:0;overflow:hidden}
th{background:#fafafa;padding:10px 14px;text-align:left;font-size:12px;font-weight:500;color:#666;border-bottom:1px solid #e5e5e5;white-space:nowrap;user-select:none}
th[onclick]:hover{background:#f0eeff;color:#7c7af8;cursor:pointer}
td{padding:9px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge.critico{background:#fef2f2;color:#dc2626}
.badge.atencao{background:#fffbeb;color:#d97706}
.badge.ok{background:#f0fdf4;color:#16a34a}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
select,input[type=text],input[type=number],input[type=date]{padding:7px 12px;border:1px solid #e5e5e5;border-radius:8px;font-size:13px;background:#fff;outline:none}
select:focus,input:focus{border-color:#7c7af8}
button{padding:8px 16px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;font-size:13px;cursor:pointer;font-weight:500;transition:.15s}
button:hover{background:#f5f5f5}
button.primary{background:#7c7af8;color:#fff;border-color:#7c7af8}
button.primary:hover{background:#6b69e8}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;text-align:center}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#f0f0f0;font-size:11px;color:#555}
.dias-badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;cursor:default}
.dias-r{background:#fef2f2;color:#dc2626}.dias-a{background:#fffbeb;color:#d97706}.dias-g{background:#f0fdf4;color:#16a34a}
.loading{text-align:center;padding:48px;color:#888}
.empty{text-align:center;padding:48px;color:#aaa;font-size:13px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:420px;max-width:90vw}
.modal h2{font-size:16px;font-weight:600;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#666;margin-bottom:4px;margin-top:12px}
.modal input{width:100%;padding:9px 12px;border:1px solid #e5e5e5;border-radius:8px;font-size:13px}
.modal .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.btn-edit{background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:4px;font-size:12px;color:#7c7af8}
.btn-edit:hover{background:#EEEDFE}
.debug-box{background:#1e1e1e;color:#aaffaa;font-family:monospace;font-size:11px;padding:12px;border-radius:8px;margin:0 24px 8px;max-height:180px;overflow:auto;display:none}
.ful-tag{display:inline-block;padding:2px 6px;border-radius:4px;background:#fef3c7;color:#b45309;font-size:10px;font-weight:600;margin-left:4px}
</style>
</head>
<body>
<div id="root"><div class="loading" style="padding:100px;font-size:16px">Verificando autenticacao...</div></div>

<div class="modal-bg" id="modalConfig">
  <div class="modal">
    <h2>Configuracoes</h2>
    <label>Periodo padrao para media de vendas (dias)</label>
    <input type="number" id="cfgPeriodo" min="7" max="365"/>
    <label>Estoque minimo cobre quantos dias (padrao)</label>
    <input type="number" id="cfgMinDias" min="1" max="180"/>
    <label>Dias uteis de producao (estrutura)</label>
    <input type="number" id="cfgDiasProducao" min="1" max="30"/>
    <div class="row">
      <button onclick="closeModal('modalConfig')">Cancelar</button>
      <button class="primary" onclick="saveConfig()">Salvar</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalMin">
  <div class="modal">
    <h2>Editar Estoque Minimo</h2>
    <p id="modalMinNome" style="font-size:13px;color:#666;margin-bottom:8px"></p>
    <label>Quantidade minima (0 = calcular automaticamente)</label>
    <input type="number" id="modalMinVal" min="0"/>
    <div class="row">
      <button onclick="closeModal('modalMin')">Cancelar</button>
      <button class="primary" onclick="saveMin()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
var config = JSON.parse(localStorage.getItem('esq_cfg') || '{"periodo":30,"minDias":15,"diasProducao":3}');
if (!config.diasProducao) config.diasProducao = 3;
var minimoCustom = JSON.parse(localStorage.getItem('esq_min') || '{}');
var dados = [];           // produtos com vendas calculadas pelo período da TABELA
var dadosBase = [];       // produtos sem vendas (só estoque/categoria) — base para recalcular
var pedidosBrutos = [];   // todos os pedidos com itens
var chartObj = null;
var editSku = null;
var sortCol = 'status', sortDir = 1;

// Períodos ativos
var chartPeriodo = { tipo: '30d', ini: daysAgoStr(30), fim: todayStr() };
var tablePeriodo = { tipo: '30d', ini: daysAgoStr(30), fim: todayStr() };

// Origens ativas
var chartOrigem = 'todos';   // 'todos' | 'normal' | 'fulfillment'
var tableOrigem = 'todos';

// ─── FERIADOS ─────────────────────────────────────────────────────────────────
function feriadosAno(ano) {
  var a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4;
  var f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  var i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  var mes=Math.floor((h+l-7*m+114)/31),dia=(h+l-7*m+114)%31+1;
  var pascoa=new Date(ano,mes-1,dia);
  function add(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
  function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var fixos=[ano+'-01-01',ano+'-04-21',ano+'-05-01',ano+'-09-07',ano+'-10-12',ano+'-11-02',ano+'-11-15',ano+'-12-25'];
  var moveis=[fmt(add(pascoa,-48)),fmt(add(pascoa,-47)),fmt(add(pascoa,-2)),fmt(pascoa),fmt(add(pascoa,60))];
  var set={};fixos.concat(moveis).forEach(function(d){set[d]=true;});return set;
}
var FERIADOS=Object.assign({},feriadosAno(new Date().getFullYear()),feriadosAno(new Date().getFullYear()+1));
function isFeriado(d){var s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return!!FERIADOS[s];}
function isDiaProducao(d){var w=d.getDay();return w!==0&&w!==6&&!isFeriado(d);}
function isDiaTrancado(d){return d.getDay()!==0;}
function avancarDiasProducao(ini,n){var d=new Date(ini),c=0;while(c<n){d.setDate(d.getDate()+1);if(isDiaProducao(d))c++;}return d;}
function avancarDiasTrancado(ini,n){var d=new Date(ini),c=isDiaTrancado(d)?1:0;while(c<n){d.setDate(d.getDate()+1);if(isDiaTrancado(d))c++;}return d;}
function calcDataPronta(diasAteMin){
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var dataLimite=new Date(hoje);dataLimite.setDate(dataLimite.getDate()+Math.max(0,Math.floor(diasAteMin)));
  var fimProd=avancarDiasProducao(hoje,config.diasProducao);
  var pronta=avancarDiasTrancado(fimProd,1);
  return{dataFimProducao:fimProd,dataPronta:pronta,diasCorridos:Math.round((pronta-hoje)/86400000),aPrazo:pronta<=dataLimite};
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().split('T')[0];}
function daysAgoStr(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0];}
function fmtDate(s){if(!s)return'-';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function dateToStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function calcStatus(est,min,diasZ,media){
  if(media<=0)return'ok';
  if(est<=min||diasZ<=7)return'critico';
  if(diasZ<=30)return'atencao';
  return'ok';
}
function periodoEmDias(ini,fim){return Math.max(1,Math.round((new Date(fim+'T23:59:59')-new Date(ini+'T00:00:00'))/86400000));}

// ─── PERÍODO HELPERS ──────────────────────────────────────────────────────────
var PERIOD_OPTS = [
  {id:'24h', label:'24h', dias:1},
  {id:'7d',  label:'7d',  dias:7},
  {id:'30d', label:'1m',  dias:30},
  {id:'60d', label:'2m',  dias:60},
  {id:'180d',label:'6m',  dias:180},
  {id:'365d',label:'1a',  dias:365},
  {id:'custom',label:'Personalizado', dias:null}
];

function setPeriodo(which, tipo, ini, fim) {
  if (which === 'chart') {
    chartPeriodo.tipo = tipo;
    chartPeriodo.ini = ini || daysAgoStr(PERIOD_OPTS.find(function(o){return o.id===tipo;})||{dias:30}.dias);
    chartPeriodo.fim = fim || todayStr();
    updatePeriodUI('chart');
    renderChart();
  } else {
    tablePeriodo.tipo = tipo;
    tablePeriodo.ini = ini || daysAgoStr((PERIOD_OPTS.find(function(o){return o.id===tipo;})||{dias:30}).dias);
    tablePeriodo.fim = fim || todayStr();
    updatePeriodUI('table');
    recalcularTabela();
  }
}

function updatePeriodUI(which) {
  var p = which === 'chart' ? chartPeriodo : tablePeriodo;
  PERIOD_OPTS.forEach(function(o) {
    var btn = document.getElementById(which+'_btn_'+o.id);
    if (btn) btn.classList.toggle('active', o.id === p.tipo);
  });
  var cr = document.getElementById(which+'_custom_range');
  if (cr) cr.classList.toggle('open', p.tipo === 'custom');
  if (p.tipo === 'custom') {
    var de = document.getElementById(which+'_custom_de');
    var ate = document.getElementById(which+'_custom_ate');
    if (de) de.value = p.ini;
    if (ate) ate.value = p.fim;
  }
}

function applyCustomPeriod(which) {
  var de  = document.getElementById(which+'_custom_de').value;
  var ate = document.getElementById(which+'_custom_ate').value;
  if (!de || !ate) return;
  setPeriodo(which, 'custom', de, ate);
}

// ─── ORIGEM ───────────────────────────────────────────────────────────────────
// Cada pedido bruto tem _origem: 'fulfillment' ou 'normal'
function setOrigem(which, val) {
  if (which === 'chart') { chartOrigem = val; updateOrigemUI('chart'); renderChart(); }
  else { tableOrigem = val; updateOrigemUI('table'); recalcularTabela(); }
}

function updateOrigemUI(which) {
  var val = which === 'chart' ? chartOrigem : tableOrigem;
  ['todos','normal','fulfillment'].forEach(function(v) {
    var btn = document.getElementById(which+'_org_'+v);
    if (btn) btn.classList.toggle('active', v === val);
  });
}

// ─── DESMEMBRAMENTO DE KITS ───────────────────────────────────────────────────
function desmembrarKit(codigo, qtdPedido) {
  if (!codigo || !String(codigo).startsWith('KT')) return null;
  var s = String(codigo).slice(2);
  var qtdEspr = parseInt(s[0], 10);
  if (isNaN(qtdEspr)) return null;
  var idx = s.indexOf('_');
  var resultado = [];
  if (idx >= 0) {
    var skuEspr = s.slice(1, idx);
    var skuMesa = s.slice(idx + 1);
    if (!skuEspr || !skuMesa) return null;
    resultado.push({sku: skuEspr, qty: qtdEspr * qtdPedido});
    resultado.push({sku: skuMesa, qty: 1 * qtdPedido});
  } else {
    var skuEspr = s.slice(1);
    if (!skuEspr) return null;
    resultado.push({sku: skuEspr, qty: qtdEspr * qtdPedido});
  }
  return resultado;
}

function extrairSku(item) {
  if (!item) return '';
  if (item.codigo) return String(item.codigo);
  if (item.produto && item.produto.codigo) return String(item.produto.codigo);
  if (item.sku) return String(item.sku);
  return '';
}

function extrairData(pedido) {
  var raw = pedido.data || pedido.dataPedido || pedido.dataEmissao || '';
  if (!raw) return new Date(0);
  try { return raw.includes('T') ? new Date(raw) : new Date(raw + 'T12:00:00'); }
  catch(e) { return new Date(0); }
}

// ─── CALCULAR VENDAS ──────────────────────────────────────────────────────────
// origem: 'todos' | 'normal' | 'fulfillment'
function calcularVendas(skuSet, dataIni, dataFim, origem) {
  var dtIni = new Date(dataIni + 'T00:00:00');
  var dtFim = new Date(dataFim + 'T23:59:59');
  var corte7d = new Date(); corte7d.setDate(corte7d.getDate()-7); corte7d.setHours(0,0,0,0);
  var vm = {}, v7 = {};

  pedidosBrutos.forEach(function(pedido) {
    // Filtro de origem
    if (origem === 'fulfillment' && pedido._origem !== 'fulfillment') return;
    if (origem === 'normal'      && pedido._origem !== 'normal') return;

    var dt = extrairData(pedido);
    if (dt < dtIni || dt > dtFim) return;
    var itens = pedido.itens || pedido.item || [];
    itens.forEach(function(item) {
      var codigo = extrairSku(item);
      if (!codigo) return;
      var qtdItem = parseFloat(item.quantidade || item.qtde || 0);
      var componentes = desmembrarKit(codigo, qtdItem);
      if (componentes) {
        componentes.forEach(function(c) {
          if (!skuSet[c.sku]) return;
          vm[c.sku] = (vm[c.sku]||0) + c.qty;
          if (dt >= corte7d) v7[c.sku] = (v7[c.sku]||0) + c.qty;
        });
      } else {
        if (!skuSet[codigo]) return;
        vm[codigo] = (vm[codigo]||0) + qtdItem;
        if (dt >= corte7d) v7[codigo] = (v7[codigo]||0) + qtdItem;
      }
    });
  });
  return {vendasMap: vm, vendas7dMap: v7};
}

// ─── MODAIS ───────────────────────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.addEventListener('click',function(e){if(e.target.classList.contains('modal-bg'))e.target.classList.remove('open');});
function saveConfig(){
  config.periodo=parseInt(document.getElementById('cfgPeriodo').value)||30;
  config.minDias=parseInt(document.getElementById('cfgMinDias').value)||15;
  config.diasProducao=parseInt(document.getElementById('cfgDiasProducao').value)||3;
  localStorage.setItem('esq_cfg',JSON.stringify(config));
  closeModal('modalConfig');
  if(dadosBase.length>0) recalcularTabela();
}
function openConfig(){
  document.getElementById('cfgPeriodo').value=config.periodo;
  document.getElementById('cfgMinDias').value=config.minDias;
  document.getElementById('cfgDiasProducao').value=config.diasProducao;
  openModal('modalConfig');
}
function openEditMin(sku,nome){
  editSku=sku;
  document.getElementById('modalMinNome').textContent=nome;
  document.getElementById('modalMinVal').value=minimoCustom[sku]||0;
  openModal('modalMin');
}
function saveMin(){
  var val=parseInt(document.getElementById('modalMinVal').value)||0;
  if(val>0) minimoCustom[editSku]=val; else delete minimoCustom[editSku];
  localStorage.setItem('esq_min',JSON.stringify(minimoCustom));
  closeModal('modalMin');
  recalcularTabela();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  try{var r=await fetch('/auth/status');var s=await r.json();if(s.authenticated)renderPainel();else renderLogin();}
  catch(e){renderLogin();}
}

function renderLogin(){
  document.getElementById('root').innerHTML=
    '<div class="login-screen"><div style="font-size:56px">&#128230;</div>'+
    '<h2>Controle de Estoque</h2>'+
    '<p>Conecte sua conta Bling para visualizar estoque e previsao de vendas em tempo real.</p>'+
    '<a href="/login"><button class="primary" style="padding:12px 32px;font-size:15px">Entrar com Bling</button></a></div>';
}

function periodBtns(which) {
  var p = which === 'chart' ? chartPeriodo : tablePeriodo;
  var btns = PERIOD_OPTS.map(function(o) {
    var cls = o.id === p.tipo ? ' active' : '';
    var extra = '';
    if (o.id === 'custom') extra = ' onclick="toggleCustom(\''+which+'\')"';
    else extra = ' onclick="setPeriodo(\''+which+'\',\''+o.id+'\')"';
    return '<button id="'+which+'_btn_'+o.id+'" class="pbtn'+cls+'"'+extra+'>'+o.label+'</button>';
  }).join('');
  var customOpen = p.tipo === 'custom' ? ' open' : '';
  var cr = '<span class="custom-range'+customOpen+'" id="'+which+'_custom_range">'+
    '<input type="date" id="'+which+'_custom_de" value="'+p.ini+'" style="padding:4px 8px;font-size:12px"/>'+
    '<span style="color:#aaa">a</span>'+
    '<input type="date" id="'+which+'_custom_ate" value="'+p.fim+'" style="padding:4px 8px;font-size:12px"/>'+
    '<button class="pbtn primary" onclick="applyCustomPeriod(\''+which+'\')" style="padding:4px 10px">Aplicar</button>'+
    '</span>';
  return '<div class="period-bar">'+btns+cr+'</div>';
}

function toggleCustom(which){
  var p = which === 'chart' ? chartPeriodo : tablePeriodo;
  if (p.tipo === 'custom') return;
  setPeriodo(which, 'custom', p.ini, p.fim);
}

function origemBtns(which) {
  var val = which === 'chart' ? chartOrigem : tableOrigem;
  return '<div class="origin-bar">'+
    '<button id="'+which+'_org_todos" class="obtn'+(val==='todos'?' active':'')+'" onclick="setOrigem(\''+which+'\',\'todos\')">Todos</button>'+
    '<button id="'+which+'_org_normal" class="obtn norm'+(val==='normal'?' active':'')+'" onclick="setOrigem(\''+which+'\',\'normal\')">Vendas normais</button>'+
    '<button id="'+which+'_org_fulfillment" class="obtn ful'+(val==='fulfillment'?' active':'')+'" onclick="setOrigem(\''+which+'\',\'fulfillment\')">Fulfillment</button>'+
    '</div>';
}

function renderPainel(){
  document.getElementById('root').innerHTML=
    '<header>'+
    '<h1>&#128230; Controle de Estoque</h1>'+
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
    '<span id="lastSync" style="font-size:12px;color:#888"></span>'+
    '<button onclick="toggleDebug()" style="font-size:11px;padding:5px 10px;color:#aaa">Debug</button>'+
    '<button onclick="syncDados()">&#x1F504; Atualizar</button>'+
    '<button onclick="openConfig()">&#x2699;&#xFE0F; Config</button>'+
    '</div></header>'+
    '<div class="cards">'+
    '<div class="card"><div class="num" id="cTotal">0</div><div class="lbl">Total de Produtos</div></div>'+
    '<div class="card critico"><div class="num" id="cCritico">0</div><div class="lbl">Estoque Critico</div></div>'+
    '<div class="card atencao"><div class="num" id="cAtencao">0</div><div class="lbl">Atencao</div></div>'+
    '<div class="card ok"><div class="num" id="cOk">0</div><div class="lbl">Estoque OK</div></div>'+
    '</div>'+
    '<div id="debugBox" class="debug-box"></div>'+
    // GRAFICO
    '<div class="panel">'+
    '<div class="panel-header">'+
    '<h3>&#x1F4CA; Vendas por Produto</h3>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
    origemBtns('chart')+
    '<select id="chartCat" onchange="renderChart()"><option value="">Todas as categorias</option></select>'+
    '</div>'+
    '</div>'+
    periodBtns('chart')+
    '<canvas id="grafico" height="90" style="margin-top:14px"></canvas>'+
    '</div>'+
    // FILTROS TABELA
    '<div class="top-bar">'+
    '<input type="text" id="busca" placeholder="Buscar SKU ou produto..." oninput="renderTable()" style="width:200px"/>'+
    '<select id="fStatus" onchange="renderTable()"><option value="">Todos os status</option><option value="critico">Critico</option><option value="atencao">Atencao</option><option value="ok">OK</option></select>'+
    '<select id="fCategoria" onchange="renderTable()"><option value="">Todas as categorias</option></select>'+
    '<label style="font-size:13px;color:#666;display:flex;align-items:center;gap:6px"><input type="checkbox" id="chkZero" onchange="renderTable()"/> Ocultar sem vendas e sem estoque</label>'+
    '</div>'+
    // PERIODO + ORIGEM DA TABELA
    '<div style="padding:0 24px 8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">'+
    origemBtns('table')+
    periodBtns('table')+
    '</div>'+
    // TABELA
    '<div class="table-wrap"><table>'+
    '<thead><tr>'+
    '<th onclick="sortBy(&quot;status&quot;)">Status <span id="srt_status"></span></th>'+
    '<th onclick="sortBy(&quot;sku&quot;)">SKU <span id="srt_sku"></span></th>'+
    '<th>Produto</th>'+
    '<th onclick="sortBy(&quot;categoria&quot;)">Categoria <span id="srt_categoria"></span></th>'+
    '<th onclick="sortBy(&quot;vendas7d&quot;)" style="text-align:right">Vendas 7d <span id="srt_vendas7d"></span></th>'+
    '<th onclick="sortBy(&quot;vendasTotal&quot;)" style="text-align:right">Vendas Total <span id="srt_vendasTotal"></span></th>'+
    '<th onclick="sortBy(&quot;mediaDia&quot;)" style="text-align:right">Media/dia <span id="srt_mediaDia"></span></th>'+
    '<th onclick="sortBy(&quot;estoque&quot;)" style="text-align:right">Estoque <span id="srt_estoque"></span></th>'+
    '<th onclick="sortBy(&quot;estoqueMin&quot;)" style="text-align:right">Est. Minimo <span id="srt_estoqueMin"></span></th>'+
    '<th onclick="sortBy(&quot;diasAteMin&quot;)">Atinge Minimo <span id="srt_diasAteMin"></span></th>'+
    '<th onclick="sortBy(&quot;diasAteZero&quot;)">Zera Estoque <span id="srt_diasAteZero"></span></th>'+
    '<th>Pronto em</th>'+
    '</tr></thead>'+
    '<tbody id="tbody"><tr><td colspan="12" class="loading">Clique em Atualizar para carregar os dados</td></tr></tbody>'+
    '</table></div>';
}

function toggleDebug(){var b=document.getElementById('debugBox');if(b)b.style.display=b.style.display==='block'?'none':'block';}
function log(msg){console.log(msg);var b=document.getElementById('debugBox');if(b){b.innerHTML+=msg+'<br>';b.scrollTop=b.scrollHeight;}}

async function blingGet(path){
  var r=await fetch('/api/bling'+path);
  if(r.status===401){renderLogin();throw new Error('Sessao expirada');}
  return r.json();
}

// ─── SYNC DADOS ───────────────────────────────────────────────────────────────
async function syncDados(){
  var tbody=document.getElementById('tbody');
  if(!tbody)return;
  tbody.innerHTML='<tr><td colspan="12" class="loading">Carregando produtos...</td></tr>';
  var debugBox=document.getElementById('debugBox');
  if(debugBox)debugBox.innerHTML='';

  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

  try{
    // 1. Produtos
    var produtos=[];
    var pagina=1;
    while(true){
      if(pagina>1) await sleep(400);
      var r=await blingGet('/produtos?pagina='+pagina+'&limite=100&situacao=A');
      var items=r.data||[];
      produtos=produtos.concat(items);
      if(items.length<100)break;
      pagina++;if(pagina>30)break;
    }
    log('[Produtos] Total bruto: '+produtos.length);
    if(produtos.length>0){
      log('[Produto #1] chaves: '+Object.keys(produtos[0]).join(', '));
      log('[Produto #1] codigo="'+produtos[0].codigo+'" nome="'+(produtos[0].nome||'').slice(0,40)+'"');
    }
    produtos=produtos.filter(function(p){
      if(!p.codigo||!String(p.codigo).startsWith('0'))return false;
      return!(p.nome||'').toLowerCase().includes('kit');
    });
    log('[Produtos] Apos filtro: '+produtos.length);

    // 2. Pedidos — busca pelo período máximo necessário (maior entre chart e table)
    tbody.innerHTML='<tr><td colspan="12" class="loading">Carregando vendas...</td></tr>';
    var hoje=new Date();
    var dataFim=hoje.toISOString().split('T')[0];
    // Pega o início mais antigo entre chart e table para buscar tudo de uma vez
    var dataIni=[chartPeriodo.ini, tablePeriodo.ini].sort()[0];

    // Situações: 15 = NF emitida, 529911 = Fulfillment
    var SITUACOES=[{id:15,origem:'normal'},{id:529911,origem:'fulfillment'}];
    var listaIds=[];
    for(var si=0;si<SITUACOES.length;si++){
      if(si>0) await sleep(400);
      var sit=SITUACOES[si];
      pagina=1;
      while(true){
        if(pagina>1) await sleep(400);
        var rp=await blingGet('/pedidos/vendas?dataInicial='+dataIni+'&dataFinal='+dataFim+'&situacao='+sit.id+'&pagina='+pagina+'&limite=100');
        var ip=rp.data||[];
        ip.forEach(function(p){if(p.id)listaIds.push({id:p.id,data:p.data,origem:sit.origem});});
        if(ip.length<100)break;
        pagina++;if(pagina>20)break;
      }
      log('[Pedidos] Situacao '+sit.id+' ('+sit.origem+'): '+listaIds.length+' acumulados');
    }
    // Deduplica mantendo a origem do primeiro encontrado
    var idsVistos={};
    listaIds=listaIds.filter(function(p){
      if(idsVistos[p.id])return false;
      idsVistos[p.id]=true;
      return true;
    });
    log('[Pedidos] Total apos dedup: '+listaIds.length);

    // 3. Busca itens individualmente
    pedidosBrutos=[];
    var LOTE=3, DELAY=500;
    for(var i=0;i<listaIds.length;i+=LOTE){
      if(i>0) await sleep(DELAY);
      var lote=listaIds.slice(i,i+LOTE);
      var resultados=await Promise.all(lote.map(function(ref){
        return blingGet('/pedidos/vendas/'+ref.id).then(function(res){
          if(res&&res.data&&!res.data.error){
            var pedido=res.data;
            if(!pedido.data&&ref.data)pedido.data=ref.data;
            pedido._origem=ref.origem; // marca a origem
            return pedido;
          }
          log('[Pedido erro] id='+ref.id+' | '+JSON.stringify(res).slice(0,100));
          return null;
        }).catch(function(){return null;});
      }));
      resultados.forEach(function(p){if(p)pedidosBrutos.push(p);});
      var pct=Math.min(i+LOTE,listaIds.length);
      tbody.innerHTML='<tr><td colspan="12" class="loading">Buscando itens... '+pct+'/'+listaIds.length+'</td></tr>';
    }
    log('[Pedidos] Com itens: '+pedidosBrutos.length);

    // 4. Monta dadosBase (sem vendas — só estoque e categoria)
    var categorias={};
    dadosBase=produtos.map(function(p){
      var sku=String(p.codigo);
      var estoque=p.estoque&&p.estoque.saldoVirtualTotal!=null?p.estoque.saldoVirtualTotal:0;
      var nomeLC=(p.nome||'').toLowerCase();
      var categoria=
        nomeLC.includes('espreguicadeira')||nomeLC.includes('espreguiçadeira')?'Espreguicadeira':
        nomeLC.includes('mesa')?'Mesa de Apoio':
        (p.categoria&&p.categoria.descricao)?p.categoria.descricao:'Outros';
      categorias[categoria]=true;
      return{id:p.id,sku,nome:p.nome||sku,categoria,estoque,customMin:!!minimoCustom[sku]};
    });

    // 5. Popular selects de categoria
    ['fCategoria','chartCat'].forEach(function(id){
      var sel=document.getElementById(id);
      if(!sel)return;
      sel.innerHTML='<option value="">Todas as categorias</option>';
      Object.keys(categorias).sort().forEach(function(c){
        sel.innerHTML+='<option value="'+c+'">'+c+'</option>';
      });
    });

    // 6. Calcula dados para tabela e renderiza tudo
    recalcularTabela();
    renderChart();
    var ls=document.getElementById('lastSync');
    if(ls)ls.textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR');

  }catch(err){
    log('[ERRO] '+err.message);
    var tb=document.getElementById('tbody');
    if(tb)tb.innerHTML='<tr><td colspan="12" class="empty">Erro: '+err.message+'</td></tr>';
  }
}

// ─── RECALCULAR TABELA ────────────────────────────────────────────────────────
function recalcularTabela(){
  if(!dadosBase.length)return;
  var skuSet={};
  dadosBase.forEach(function(d){skuSet[d.sku]=true;});
  var calc=calcularVendas(skuSet,tablePeriodo.ini,tablePeriodo.fim,tableOrigem);
  var vm=calc.vendasMap, v7=calc.vendas7dMap;
  var periodo=periodoEmDias(tablePeriodo.ini,tablePeriodo.fim);

  dados=dadosBase.map(function(b){
    var vendasTotal=vm[b.sku]||0;
    var vendas7d=v7[b.sku]||0;
    var mediaDia=vendasTotal/periodo;
    var estoqueMin=minimoCustom[b.sku]?minimoCustom[b.sku]:Math.ceil(mediaDia*config.minDias);
    var diasAteMin=mediaDia>0?Math.floor((b.estoque-estoqueMin)/mediaDia):999;
    var diasAteZero=mediaDia>0?Math.floor(b.estoque/mediaDia):999;
    var status=calcStatus(b.estoque,estoqueMin,diasAteZero,mediaDia);
    var infoProd=mediaDia>0?calcDataPronta(diasAteMin):null;
    return Object.assign({},b,{vendasTotal,vendas7d,mediaDia,estoqueMin,diasAteMin,diasAteZero,status,infoProd});
  });

  updateCards();
  renderTable();
  updatePeriodUI('table');
  updateOrigemUI('table');
}

// ─── CARDS ────────────────────────────────────────────────────────────────────
function updateCards(){
  var el=function(id){return document.getElementById(id);};
  if(el('cTotal'))el('cTotal').textContent=dados.length;
  if(el('cCritico'))el('cCritico').textContent=dados.filter(function(d){return d.status==='critico';}).length;
  if(el('cAtencao'))el('cAtencao').textContent=dados.filter(function(d){return d.status==='atencao';}).length;
  if(el('cOk'))el('cOk').textContent=dados.filter(function(d){return d.status==='ok';}).length;
}

// ─── GRÁFICO ──────────────────────────────────────────────────────────────────
function renderChart(){
  var canvas=document.getElementById('grafico');
  if(!canvas)return;
  var catFiltro=(document.getElementById('chartCat')||{}).value||'';
  var skuSet={};
  dadosBase.forEach(function(d){skuSet[d.sku]=true;});
  var calc=calcularVendas(skuSet,chartPeriodo.ini,chartPeriodo.fim,chartOrigem);
  var vm=calc.vendasMap;

  var base=catFiltro?dadosBase.filter(function(d){return d.categoria===catFiltro;}):dadosBase;
  var comVenda=base.filter(function(d){return(vm[d.sku]||0)>0;});
  var top=comVenda.length>0
    ?comVenda.slice().sort(function(a,b){return(vm[b.sku]||0)-(vm[a.sku]||0);}).slice(0,20)
    :base.slice().sort(function(a,b){return b.estoque-a.estoque;}).slice(0,20);

  // Cor por status atual (dos dados da tabela)
  var statusMap={};
  dados.forEach(function(d){statusMap[d.sku]=d.status;});
  var cores=top.map(function(d){
    var s=statusMap[d.sku]||'ok';
    return s==='critico'?'rgba(220,38,38,0.75)':s==='atencao'?'rgba(217,119,6,0.75)':'rgba(22,163,74,0.75)';
  });

  if(chartObj)chartObj.destroy();
  chartObj=new Chart(canvas,{
    type:'bar',
    data:{
      labels:top.map(function(d){return d.sku;}),
      datasets:[{
        label:comVenda.length>0?'Vendas no periodo':'Estoque atual',
        data:top.map(function(d){return comVenda.length>0?(vm[d.sku]||0):d.estoque;}),
        backgroundColor:cores,borderRadius:5
      }]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{position:'top'},
        tooltip:{callbacks:{
          title:function(items){return top[items[0].dataIndex].nome;},
          label:function(ctx){
            var d=top[ctx.dataIndex];
            var s=statusMap[d.sku]||'ok';
            return[
              ' Vendas: '+ctx.parsed.y,
              ' Estoque: '+d.estoque,
              ' Status: '+s
            ];
          }
        }}
      },
      scales:{y:{beginAtZero:true,title:{display:true,text:'Unidades'}}}
    }
  });
  updatePeriodUI('chart');
  updateOrigemUI('chart');
}

// ─── SORT ─────────────────────────────────────────────────────────────────────
function sortBy(col){
  if(sortCol===col){sortDir*=-1;}
  else{sortCol=col;sortDir=(col==='status'||col==='sku'||col==='categoria')?1:-1;}
  ['status','sku','categoria','vendas7d','vendasTotal','mediaDia','estoque','estoqueMin','diasAteMin','diasAteZero'].forEach(function(c){
    var el=document.getElementById('srt_'+c);
    if(el)el.textContent=c===sortCol?(sortDir===1?'▲':'▼'):'';
  });
  renderTable();
}

// ─── TABELA ───────────────────────────────────────────────────────────────────
function renderTable(){
  var busca=((document.getElementById('busca')||{}).value||'').toLowerCase();
  var fStatus=(document.getElementById('fStatus')||{}).value||'';
  var fCat=(document.getElementById('fCategoria')||{}).value||'';
  var chkZero=(document.getElementById('chkZero')||{}).checked||false;

  var rows=dados.filter(function(d){
    if(busca&&d.sku.toLowerCase().indexOf(busca)<0&&d.nome.toLowerCase().indexOf(busca)<0)return false;
    if(fStatus&&d.status!==fStatus)return false;
    if(fCat&&d.categoria!==fCat)return false;
    if(chkZero&&d.vendasTotal===0&&d.estoque===0)return false;
    return true;
  });

  rows.sort(function(a,b){
    var av=a[sortCol],bv=b[sortCol];
    if(sortCol==='status'){var ord={critico:0,atencao:1,ok:2};av=ord[a.status];bv=ord[b.status];}
    if(sortCol==='diasAteMin'||sortCol==='diasAteZero'){
      if(av>=999&&bv>=999)return 0;if(av>=999)return 1;if(bv>=999)return -1;
    }
    if(typeof av==='string')return sortDir*av.localeCompare(bv);
    return sortDir*((av||0)-(bv||0));
  });

  var tbody=document.getElementById('tbody');
  if(!tbody)return;
  if(!rows.length){tbody.innerHTML='<tr><td colspan="12" class="empty">Nenhum produto encontrado</td></tr>';return;}

  function badge(s){
    if(s==='critico')return'<span class="badge critico"><span class="dot"></span>Critico</span>';
    if(s==='atencao')return'<span class="badge atencao"><span class="dot"></span>Atencao</span>';
    return'<span class="badge ok"><span class="dot"></span>OK</span>';
  }
  function diasBadge(dias){
    if(dias>=999||dias<0)return'<span style="color:#ccc">-</span>';
    var cls=dias<=7?'dias-r':dias<=30?'dias-a':'dias-g';
    var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+Math.floor(dias));
    return'<span class="dias-badge '+cls+'" title="em '+dias+' dias">'+fmtDate(dateToStr(d))+'</span>';
  }
  function prodBadge(info){
    if(!info)return'<span style="color:#ccc">-</span>';
    var dt=fmtDate(dateToStr(info.dataPronta));
    var cls=info.aPrazo?'dias-g':'dias-r';
    var tip='Prod finaliza: '+fmtDate(dateToStr(info.dataFimProducao))+' | Pronto: '+dt+' | '+(info.aPrazo?'a prazo':'atrasado');
    return'<span class="dias-badge '+cls+'" title="'+tip+'">'+dt+'</span>';
  }

  var html='';
  rows.forEach(function(d){
    var minLabel=d.estoqueMin>0?d.estoqueMin:'-';
    var customTag=d.customMin?' <span style="font-size:10px;color:#7c7af8">*</span>':'';
    var nomeEsc=d.nome.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    html+=
      '<tr>'+
      '<td>'+badge(d.status)+'</td>'+
      '<td><span class="tag">'+d.sku+'</span></td>'+
      '<td style="max-width:220px;cursor:pointer" onclick="toggleNome(this)" title="Clique para expandir">'+
      '<span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+d.nome+'</span></td>'+
      '<td style="color:#888;font-size:12px">'+d.categoria+'</td>'+
      '<td style="text-align:right">'+(d.vendas7d>0?'<strong>'+d.vendas7d+'</strong>':'<span style="color:#ccc">0</span>')+'</td>'+
      '<td style="text-align:right">'+d.vendasTotal+'</td>'+
      '<td style="text-align:right">'+(d.mediaDia>0?d.mediaDia.toFixed(2):'-')+'</td>'+
      '<td style="text-align:right;font-weight:600">'+d.estoque+'</td>'+
      '<td style="text-align:right">'+minLabel+customTag+' <button class="btn-edit" onclick="openEditMin(\''+d.sku+'\',\''+nomeEsc+'\')" title="Editar minimo">&#9998;</button></td>'+
      '<td>'+diasBadge(d.diasAteMin)+'</td>'+
      '<td>'+diasBadge(d.diasAteZero)+'</td>'+
      '<td>'+prodBadge(d.infoProd)+'</td>'+
      '</tr>';
  });
  tbody.innerHTML=html;
}

function toggleNome(td){
  var span=td.querySelector('span');
  if(!span)return;
  if(span.style.whiteSpace==='normal'){
    span.style.whiteSpace='nowrap';span.style.overflow='hidden';span.style.textOverflow='ellipsis';td.style.maxWidth='220px';
  }else{
    span.style.whiteSpace='normal';span.style.overflow='visible';span.style.textOverflow='unset';td.style.maxWidth='400px';
  }
}

init();
</script>
