<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYPE decor — Controle de Estoque</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;font-size:14px}
header{background:#0d2b35;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
header img{height:36px;background:#fff;border-radius:8px;padding:4px 8px;object-fit:contain}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtns span{font-size:12px;color:rgba(255,255,255,.5)}
.hbtn{padding:6px 14px;border-radius:7px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:12px;cursor:pointer;font-weight:500;transition:.15s}
.hbtn:hover{background:rgba(255,255,255,.18)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px 24px 0}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:12px 14px}
.card .num{font-size:22px;font-weight:600;margin-bottom:2px}
.card .lbl{font-size:11px;color:#888;display:flex;align-items:center;gap:4px}
.card.critico .num{color:#dc2626}.card.atencao .num{color:#d97706}.card.ok .num{color:#16a34a}
.card.fat .num{color:#1d4ed8}.card.full .num{color:#f59e0b}
.panel{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px 20px;margin:12px 24px 0}
.panel-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.panel-header h3{font-size:13px;font-weight:600;color:#444;margin:0}
.period-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px}
.pbtn{padding:4px 10px;border-radius:6px;border:1px solid #e5e5e5;background:#fff;font-size:12px;cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap}
.pbtn:hover{background:#f0eeff;border-color:#7c7af8;color:#7c7af8}
.pbtn.active{background:#7c7af8;color:#fff;border-color:#7c7af8}
.custom-range{display:none;align-items:center;gap:4px;font-size:12px;margin-top:6px}
.custom-range.open{display:flex}
.obtn{padding:4px 12px;border-radius:6px;border:1px solid #e5e5e5;background:#fff;font-size:12px;cursor:pointer;font-weight:500;transition:.15s}
.obtn:hover{background:#f0eeff;border-color:#7c7af8}
.obtn.active{background:#7c7af8;color:#fff;border-color:#7c7af8}
.obtn.ful.active{background:#f59e0b;border-color:#f59e0b}
.obtn.norm.active{background:#16a34a;border-color:#16a34a}
.top-bar{padding:10px 24px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.table-wrap{padding:10px 24px 32px;overflow-x:auto}
table{width:100%;background:#fff;border-radius:10px;border:1px solid #e5e5e5;border-collapse:separate;border-spacing:0;overflow:hidden}
th{background:#fafafa;padding:9px 12px;text-align:left;font-size:11px;font-weight:500;color:#666;border-bottom:1px solid #e5e5e5;white-space:nowrap;user-select:none}
th.sortable:hover{background:#f0eeff;color:#7c7af8;cursor:pointer}
td{padding:8px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge.critico{background:#fef2f2;color:#dc2626}
.badge.atencao{background:#fffbeb;color:#d97706}
.badge.ok{background:#f0fdf4;color:#16a34a}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
select,input[type=text],input[type=number],input[type=date]{padding:6px 10px;border:1px solid #e5e5e5;border-radius:8px;font-size:13px;background:#fff;outline:none}
select:focus,input:focus{border-color:#7c7af8}
button{padding:7px 14px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;font-size:13px;cursor:pointer;font-weight:500;transition:.15s}
button:hover{background:#f5f5f5}
button.primary{background:#7c7af8;color:#fff;border-color:#7c7af8}
button.primary:hover{background:#6b69e8}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;text-align:center}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:#f0f0f0;font-size:11px;color:#555}
.dias-badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;cursor:default}
.dias-r{background:#fef2f2;color:#dc2626}.dias-a{background:#fffbeb;color:#d97706}.dias-g{background:#f0fdf4;color:#16a34a}
.loading{text-align:center;padding:48px;color:#888}
.empty{text-align:center;padding:48px;color:#aaa;font-size:13px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:460px;max-width:92vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:600;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#666;margin-bottom:4px;margin-top:12px}
.modal input{width:100%;padding:9px 12px;border:1px solid #e5e5e5;border-radius:8px;font-size:13px}
.modal .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.hint{font-size:11px;color:#aaa;margin-top:3px;line-height:1.4}
.tooltip-wrap{position:relative;display:inline-flex;align-items:center}
.tooltip-icon{width:15px;height:15px;border-radius:50%;background:#e0e0e0;color:#666;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex-shrink:0}
.tooltip-box{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:11px;padding:8px 10px;border-radius:8px;width:220px;line-height:1.5;z-index:300;white-space:normal}
.tooltip-wrap:hover .tooltip-box{display:block}
.min-cell{cursor:pointer;border-radius:4px;padding:2px 4px;transition:.15s}
.min-cell:hover{background:#f0eeff;color:#7c7af8}
.min-cell input{width:60px;padding:2px 6px;font-size:12px;border:1px solid #7c7af8;border-radius:4px;outline:none}
.tabs{display:flex;gap:0;padding:12px 24px 0;border-bottom:1px solid #e5e5e5;margin:0 0 0}
.tab{padding:9px 20px;font-size:13px;font-weight:500;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:.15s;background:none;border-top:none;border-left:none;border-right:none;border-radius:0}
.tab:hover{color:#0d2b35}
.tab.active{color:#0d2b35;border-bottom-color:#0d2b35;font-weight:600}
.tab-content{display:none}.tab-content.active{display:block}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:16px 24px}
.metric-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px}
.metric-card h4{font-size:12px;font-weight:600;color:#666;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.metric-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.metric-bar-wrap{flex:1;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.metric-bar{height:100%;border-radius:4px;transition:.3s}
.metric-label{font-size:12px;color:#444;min-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-val{font-size:12px;font-weight:600;color:#1a1a1a;min-width:32px;text-align:right}
.metric-pct{font-size:11px;color:#888;min-width:36px;text-align:right}
.metric-period-bar{padding:12px 24px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dev-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px;margin:0 24px 16px}
.dev-card h4{font-size:12px;font-weight:600;color:#dc2626;margin-bottom:8px;text-transform:uppercase}
.dev-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:12px}
.dev-row:last-child{border-bottom:none}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="root"><div class="loading" style="padding:100px;font-size:16px">Verificando autenticação...</div></div>

<!-- Modal Config -->
<div class="modal-bg" id="modalConfig">
  <div class="modal">
    <h2>⚙️ Configurações</h2>

    <label>Período para média de vendas</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <button class="pbtn" onclick="setCfgPeriodo(1)">24h</button>
      <button class="pbtn" onclick="setCfgPeriodo(7)">7 dias</button>
      <button class="pbtn" onclick="setCfgPeriodo(30)">1 mês</button>
      <button class="pbtn" onclick="setCfgPeriodo(60)">2 meses</button>
      <button class="pbtn" onclick="setCfgPeriodo(180)">6 meses</button>
      <button class="pbtn" onclick="setCfgPeriodo(365)">1 ano</button>
    </div>
    <input type="number" id="cfgPeriodo" min="1" max="365" placeholder="dias"/>

    <div style="margin-top:16px;padding:12px;background:#eff6ff;border-radius:8px;border:1px solid #bfdbfe">
      <div style="font-size:12px;font-weight:600;color:#1d4ed8;margin-bottom:10px">📦 Faturamento</div>

      <label style="display:flex;align-items:center;gap:6px">
        Estoque mínimo cobre quantos dias
        <span class="tooltip-wrap"><span class="tooltip-icon">?</span>
        <span class="tooltip-box">Mínimo calculado como: <strong>média Fat./dia × dias</strong>. Edições manuais na tabela sobrescrevem.</span></span>
      </label>
      <input type="number" id="cfgMinDias" min="1" max="180"/>

      <label>Dias úteis de produção (seg–sex, excluindo feriados)</label>
      <input type="number" id="cfgDiasProducao" min="1" max="30"/>

      <label style="display:flex;align-items:center;gap:6px">
        Base para sugestão
        <span class="tooltip-wrap"><span class="tooltip-icon">?</span>
        <span class="tooltip-box">Atingir mínimo: sugere iniciar antes do estoque cair abaixo do mínimo. Zerar: sugere antes de acabar completamente.</span></span>
      </label>
      <select id="cfgBaseSug">
        <option value="min">Atingir mínimo</option>
        <option value="zero">Zerar estoque</option>
      </select>
    </div>

    <div style="margin-top:12px;padding:12px;background:#fffbf0;border-radius:8px;border:1px solid #fde68a">
      <div style="font-size:12px;font-weight:600;color:#d97706;margin-bottom:10px">🟡 Fulfillment ML</div>

      <label style="display:flex;align-items:center;gap:6px">
        Estoque mínimo cobre quantos dias
        <span class="tooltip-wrap"><span class="tooltip-icon">?</span>
        <span class="tooltip-box">Mínimo Full calculado como: <strong>média Full/dia × dias</strong>. Deve cobrir o prazo total de reposição (produção + logística).</span></span>
      </label>
      <input type="number" id="cfgMinDiasFull" min="1" max="180"/>

      <label>Dias de logística ML (além da produção)</label>
      <input type="number" id="cfgDiasLogFull" min="0" max="30"/>
      <div class="hint">Prazo total Full = dias de produção + dias de logística. Ex: 3 + 10 = 13 dias.</div>

      <label style="display:flex;align-items:center;gap:6px">
        Base para sugestão
        <span class="tooltip-wrap"><span class="tooltip-icon">?</span>
        <span class="tooltip-box">Mesma lógica do Faturamento, mas aplicada ao canal Full.</span></span>
      </label>
      <select id="cfgBaseSugFull">
        <option value="min">Atingir mínimo</option>
        <option value="zero">Zerar estoque</option>
      </select>
    </div>

    <label style="margin-top:12px">Data início do histórico de vendas</label>
    <input type="date" id="cfgDataInicio"/>
    <div class="hint">Usado para buscar o histórico completo no primeiro carregamento.</div>

    <div class="row">
      <button onclick="closeModal('modalConfig')">Cancelar</button>
      <button class="primary" onclick="saveConfig()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal editar mínimo inline — não usado, edição é direto na célula -->

<script>
// ─── CONSTANTES ──────────────────────────────────────────────────────────────
var DEP_FATURAMENTO = 14888413957;
var DEP_FULFILLMENT = 14888519189;

// ─── CONFIG ───────────────────────────────────────────────────────────────────
var config = JSON.parse(localStorage.getItem('esq_cfg') || '{"periodo":30,"minDias":5,"diasProducao":3,"minDiasFull":13,"diasLogFull":10,"baseSug":"min","baseSugFull":"min","dataInicio":""}');
if (!config.minDias) config.minDias = 5;
if (!config.diasProducao) config.diasProducao = 3;
if (!config.minDiasFull) config.minDiasFull = 13;
if (!config.diasLogFull && config.diasLogFull !== 0) config.diasLogFull = 10;
if (!config.baseSug) config.baseSug = 'min';
if (!config.baseSugFull) config.baseSugFull = 'min';

var minimoCustom = JSON.parse(localStorage.getItem('esq_min') || '{}');
// minimoCustom[sku] = valor manual para Faturamento
// minimoCustomFull[sku] = valor manual para Fulfillment
var minimoCustomFull = JSON.parse(localStorage.getItem('esq_min_full') || '{}');
var dadosBase = [];
var dados = [];
var saldosDeposito = {};
var pedidosBrutos = [];
var dataInicioBuscada = null; // data de início da última busca feita
var histVendas = JSON.parse(localStorage.getItem('esq_hist') || '{"lastDate":"","vendas":{},"vendasFull":{}}');
var chartObj = null, donutObj = null;
var sortCol = 'status', sortDir = 1;
var chartOrigem = 'todos', tableOrigem = 'todos';

// ─── FERIADOS ─────────────────────────────────────────────────────────────────
function feriadosAno(ano){
  var a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  var i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  var mes=Math.floor((h+l-7*m+114)/31),dia=(h+l-7*m+114)%31+1;
  var pascoa=new Date(ano,mes-1,dia);
  function add(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
  function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var fixos=[ano+'-01-01',ano+'-04-21',ano+'-05-01',ano+'-09-07',ano+'-10-12',ano+'-11-02',ano+'-11-15',ano+'-12-25'];
  var moveis=[fmt(add(pascoa,-48)),fmt(add(pascoa,-47)),fmt(add(pascoa,-2)),fmt(pascoa),fmt(add(pascoa,60))];
  var set={};fixos.concat(moveis).forEach(function(d){set[d]=true;});return set;
}
var FERIADOS=Object.assign({},feriadosAno(new Date().getFullYear()),feriadosAno(new Date().getFullYear()+1));
function isFeriado(d){var s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return!!FERIADOS[s];}
function isDiaUtil(d){var w=d.getDay();return w!==0&&w!==6&&!isFeriado(d);}
function avancarDiasUteis(ini,n){var d=new Date(ini),c=0;while(c<n){d.setDate(d.getDate()+1);if(isDiaUtil(d))c++;}return d;}
function dateToStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return'-';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
// ─── DATA/HORA GMT-3 (Brasília) ───────────────────────────────────────────────
var _serverTimeOffset = 0; // diferença entre relógio do servidor e local em ms

async function sincronizarHora(){
  try{
    var t0=Date.now();
    var r=await fetch('/api/hora');
    var j=await r.json();
    var t1=Date.now();
    // Estima hora do servidor no meio da requisição
    var serverNow=j.utc+Math.round((t1-t0)/2);
    _serverTimeOffset=serverNow-t1;
    log('[Hora] offset servidor: '+_serverTimeOffset+'ms');
  }catch(e){
    _serverTimeOffset=0; // fallback: usa relógio local
  }
}

function agoraBrasilia(){
  // Usa timestamp UTC do servidor e subtrai 3h fixas para GMT-3
  var utcNow = Date.now() + _serverTimeOffset;
  return new Date(utcNow - 3 * 3600000);
}
function todayStr(){
  var d=agoraBrasilia();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStartStr(){return todayStr()+'T00:00:00';}
function agoraStr(){
  var d=agoraBrasilia();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+
    'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00';
}
function daysAgoStr(n){
  var d=agoraBrasilia();d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function hoursAgoStr(n){
  var d=agoraBrasilia();d.setHours(d.getHours()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+
    'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00';
}
function periodoEmDias(ini,fim){return Math.max(1,Math.round((new Date(fim+'T23:59:59')-new Date(ini+'T00:00:00'))/86400000));}
function calcStatus(est,min,diasZ,media){if(media<=0)return'ok';if(est<=min||diasZ<=7)return'critico';if(diasZ<=30)return'atencao';return'ok';}

// Calcula data sugerida para iniciar fabricação
function calcSugestao(diasAteAlvo){
  return calcSugestaoComPrazo(diasAteAlvo, config.diasProducao);
}
function calcSugestaoComPrazo(diasAteAlvo, prazo){
  if(diasAteAlvo>=999||diasAteAlvo<0)return null;
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var diaAlvo=new Date(hoje);diaAlvo.setDate(diaAlvo.getDate()+Math.floor(diasAteAlvo));
  var d=new Date(diaAlvo),c=0;
  while(c<prazo){d.setDate(d.getDate()-1);if(isDiaUtil(d))c++;}
  var hoje0=new Date();hoje0.setHours(0,0,0,0);
  var diasAteInicio=Math.round((d-hoje0)/86400000);
  return{dataInicio:d,diasAteInicio:diasAteInicio,diaAlvo:diaAlvo,atrasado:diasAteInicio<=0};
}

// ─── PERÍODO ──────────────────────────────────────────────────────────────────
var PERIOD_OPTS=[
  {id:'hoje',label:'Hoje',dias:null},
  {id:'1d',label:'24h',dias:null},
  {id:'7d',label:'7d',dias:7},{id:'30d',label:'1m',dias:30},
  {id:'60d',label:'2m',dias:60},{id:'180d',label:'6m',dias:180},{id:'365d',label:'1a',dias:365},
  {id:'custom',label:'Personalizado',dias:null}
];
function getPeriodoIni(tipo){
  if(tipo==='hoje')return todayStr();           // 00:00 de hoje GMT-3
  if(tipo==='1d')return daysAgoStr(1);          // 24h atrás GMT-3
  var opt=PERIOD_OPTS.find(function(o){return o.id===tipo;});
  return opt&&opt.dias?daysAgoStr(opt.dias):daysAgoStr(30);
}
// Gráfico padrão = Hoje; Tabela padrão = 1 mês
var chartPeriodo = {tipo:'hoje', ini:todayStr(), fim:todayStr()};
var tablePeriodo = {tipo:'30d', ini:daysAgoStr(30), fim:todayStr()};
function setPeriodo(which,tipo,ini,fim){
  var iniCalc=ini||getPeriodoIni(tipo);
  var fimCalc=fim||todayStr();
  var p={tipo:tipo,ini:iniCalc,fim:fimCalc};
  if(which==='chart'){chartPeriodo=p;updatePeriodUI('chart');}
  else{tablePeriodo=p;updatePeriodUI('table');}
  var novoIni=[chartPeriodo.ini,tablePeriodo.ini].sort()[0];
  if(dataInicioBuscada===null||novoIni<dataInicioBuscada){
    syncDados();
    return;
  }
  if(which==='chart')renderChart();
  else recalcularTabela();
}
function updatePeriodUI(which){
  var p=which==='chart'?chartPeriodo:tablePeriodo;
  PERIOD_OPTS.forEach(function(o){var b=document.getElementById(which+'_btn_'+o.id);if(b)b.classList.toggle('active',o.id===p.tipo);});
  var cr=document.getElementById(which+'_custom_range');if(cr)cr.classList.toggle('open',p.tipo==='custom');
}
function applyCustomPeriod(which){
  var de=document.getElementById(which+'_custom_de').value;
  var ate=document.getElementById(which+'_custom_ate').value;
  if(de&&ate)setPeriodo(which,'custom',de,ate);
}
function periodBtns(which){
  var p=which==='chart'?chartPeriodo:tablePeriodo;
  var btns=PERIOD_OPTS.map(function(o){
    var cls=o.id===p.tipo?' active':'';
    var fn=o.id==='custom'?'toggleCustom(\''+which+'\')':'setPeriodo(\''+which+'\',\''+o.id+'\')';

function atualizarColunasDeposito(){
  var mostrarNormal = tableOrigem !== 'fulfillment';
  var mostrarFull   = tableOrigem !== 'normal';
  var filtrado      = tableOrigem !== 'todos';
  var thN   = document.getElementById('th_vendasNormal');
  var thF   = document.getElementById('th_vendasFull');
  var thT   = document.getElementById('th_vendasTotal');
  if(thN) thN.style.display = (!filtrado) ? '' : (mostrarNormal ? '' : 'none');
  if(thF) thF.style.display = (!filtrado) ? '' : (mostrarFull   ? '' : 'none');
  if(thT) thT.style.display = filtrado ? 'none' : '';
  if(filtrado){
    if(thN&&mostrarNormal)thN.childNodes[0].textContent='Vendas ';
    if(thF&&mostrarFull)  thF.childNodes[0].textContent='Vendas ';
  }else{
    if(thN)thN.childNodes[0].textContent='Vendas Fat. ';
    if(thF)thF.childNodes[0].textContent='Vendas Full ';
  }
  var styleId='col_visibility_style';
  var el=document.getElementById(styleId);
  if(!el){el=document.createElement('style');el.id=styleId;document.head.appendChild(el);}
  var css='';
  if(!mostrarNormal)css+='.col_vendasNormal{display:none}';
  if(!mostrarFull)  css+='.col_vendasFull{display:none}';
  if(filtrado)      css+='.col_vendasTotal{display:none}';
  el.textContent=css;
}

// ─── KITS ─────────────────────────────────────────────────────────────────────
function desmembrarKit(codigo,qtdPedido){
  if(!codigo||!String(codigo).startsWith('KT'))return null;
  var s=String(codigo).slice(2);
  var qtd=parseInt(s[0],10);if(isNaN(qtd))return null;
  var idx=s.indexOf('_'),res=[];
  if(idx>=0){var se=s.slice(1,idx),sm=s.slice(idx+1);if(!se||!sm)return null;res.push({sku:se,qty:qtd*qtdPedido});res.push({sku:sm,qty:1*qtdPedido});}
  else{var sk=s.slice(1);if(!sk)return null;res.push({sku:sk,qty:qtd*qtdPedido});}
  return res;
}
function extrairSku(item){
  if(!item)return'';
  if(item.codigo)return String(item.codigo);
  if(item.produto&&item.produto.codigo)return String(item.produto.codigo);
  return'';
}
function extrairData(pedido){
  var raw=pedido.data||pedido.dataPedido||'';
  if(!raw)return new Date(0);
  try{return raw.includes('T')?new Date(raw):new Date(raw+'T12:00:00');}catch(e){return new Date(0);}
}

// ─── CALCULAR VENDAS ──────────────────────────────────────────────────────────
function calcularVendas(skuSet,dataIni,dataFim,origem,tipoIni){
  var dtIni, dtFim, compararSoData=false;
  if(tipoIni==='hoje'){
    // Compara só a data (string), ignora hora — evita bug de fuso UTC vs GMT-3
    compararSoData=true;
    dtIni=todayStr();
    dtFim=todayStr();
  } else if(tipoIni==='1d'){
    dtIni=new Date(hoursAgoStr(24));
    dtFim=new Date(agoraStr());
  } else {
    dtIni=new Date(dataIni+'T00:00:00');
    dtFim=new Date(dataFim+'T23:59:59');
  }
  var vm={},vn={},vf={};
  pedidosBrutos.forEach(function(pedido){
    if(origem==='fulfillment'&&pedido._origem!=='fulfillment')return;
    if(origem==='normal'&&pedido._origem!=='normal')return;
    var passou=false;
    if(compararSoData){
      // Compara só a parte da data (YYYY-MM-DD) para evitar bug de fuso
      var dataPedido=(pedido.data||'').slice(0,10);
      passou=dataPedido>=dtIni&&dataPedido<=dtFim;
    } else {
      var dt=extrairData(pedido);
      passou=dt>=dtIni&&dt<=dtFim;
    }
    if(!passou)return;
    var itens=pedido.itens||pedido.item||[];
    itens.forEach(function(item){
      var codigo=extrairSku(item);if(!codigo)return;
      var qtdItem=parseFloat(item.quantidade||item.qtde||0);
      var comps=desmembrarKit(codigo,qtdItem);
      var lista=comps?comps:[{sku:codigo,qty:qtdItem}];
      lista.forEach(function(c){
        if(!skuSet[c.sku])return;
        vm[c.sku]=(vm[c.sku]||0)+c.qty;
        if(pedido._origem==='fulfillment')vf[c.sku]=(vf[c.sku]||0)+c.qty;
        else vn[c.sku]=(vn[c.sku]||0)+c.qty;
      });
    });
  });
  return{vendasMap:vm,vendasNormal:vn,vendasFull:vf};
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
// ─── SYNC LEVE (automático a cada 10 min) ────────────────────────────────────
async function syncLeve(){
  if(!dadosBase.length)return; // só roda se já teve carga completa
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  await sincronizarHora();
  try{
    var hoje=todayStr();
    var dataIni2h=hoursAgoStr(2).slice(0,10); // data de 2h atrás (pode ser ontem perto da meia-noite)

    // 1. Busca pedidos das últimas 2h
    var SITS=[{id:15,origem:'normal'},{id:21,origem:'normal'},{id:529911,origem:'fulfillment'}];
    var novosIds=[];
    for(var si=0;si<SITS.length;si++){
      if(si>0)await sleep(400);
      var rp=await blingGet('/pedidos/vendas?dataInicial='+dataIni2h+'&dataFinal='+hoje+'&situacao='+SITS[si].id+'&pagina=1&limite=100');
      (rp.data||[]).forEach(function(p){if(p.id)novosIds.push({id:p.id,data:p.data,origem:SITS[si].origem});});
    }
    // Dedup
    var idMap={};
    novosIds.forEach(function(p){if(!idMap[p.id]||p.origem==='fulfillment')idMap[p.id]=p;});
    novosIds=Object.keys(idMap).map(function(k){return idMap[k];});

    // Busca detalhes dos novos pedidos via servidor
    var novosPedidos=[];
    if(novosIds.length>0){
      var idDataMapL={};novosIds.forEach(function(r){idDataMapL[r.id]=r.data;});
      var loteIdsL=novosIds.map(function(r){return r.id;}).join(',');
      var rsL=await fetch('/api/pedidos-detalhes?ids='+loteIdsL);
      if(rsL.status!==401){
        var jsonL=await rsL.json();
        (jsonL.data||[]).forEach(function(pedido){
          if(!pedido)return;
          if(!pedido.data)pedido.data=idDataMapL[pedido.id]||'';
          var sitId=pedido.situacao&&pedido.situacao.id;
          pedido._origem=sitId===529911?'fulfillment':'normal';
          novosPedidos.push(pedido);
        });
      }
    }

    // Mescla com pedidosBrutos: substitui se ID já existe, adiciona se novo
    var pedidosMap={};
    pedidosBrutos.forEach(function(p){pedidosMap[p.id]=p;});
    novosPedidos.forEach(function(p){pedidosMap[p.id]=p;});
    pedidosBrutos=Object.values(pedidosMap);

    // 2. Atualiza saldos de estoque
    var ids=dadosBase.map(function(p){return p.id;});
    for(var si2=0;si2<ids.length;si2+=20){
      if(si2>0)await sleep(400);
      var loteIds=ids.slice(si2,si2+20);
      var qs=loteIds.map(function(id){return'idsProdutos[]='+id;}).join('&');
      var rs2=await blingGet('/estoques/saldos?'+qs);
      (rs2.data||[]).forEach(function(item){
        var pid=item.produto&&item.produto.id;if(!pid)return;
        var fat=0,full=0;
        (item.depositos||[]).forEach(function(dep){
          if(dep.id===DEP_FATURAMENTO)fat=dep.saldoVirtual||0;
          else if(dep.id===DEP_FULFILLMENT)full=dep.saldoVirtual||0;
        });
        saldosDeposito[pid]={fat:fat,full:full};
      });
    }

    // 3. Atualiza dadosBase com novos saldos
    dadosBase=dadosBase.map(function(b){
      var dep=saldosDeposito[b.id]||{};
      return Object.assign({},b,{
        estoqueFat:dep.fat!=null?dep.fat:b.estoque,
        estoqueFull:dep.full||0
      });
    });

    // 4. Recalcula silenciosamente mantendo todos os filtros
    recalcularTabela();
    renderChart();
    var ls=document.getElementById('lastSync');
    if(ls)ls.textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR');
    log('[SyncLeve] OK — '+novosPedidos.length+' pedidos atualizados');
  }catch(e){
    log('[SyncLeve] Erro: '+e.message);
  }
}

    if(s.authenticated){

}

async function blingGet(path, tentativa){
  tentativa = tentativa || 1;
  var r = await fetch('/api/bling' + path);
  if(r.status === 401){renderLogin(); throw new Error('Sessão expirada');}
  if(r.status === 429){
    if(tentativa <= 3){
      log('[Rate limit] aguardando 2s... tentativa ' + tentativa);
      await new Promise(function(res){setTimeout(res, 2000 * tentativa);});
      return blingGet(path, tentativa + 1);
    }
    throw new Error('Rate limit após 3 tentativas');
  }
  return r.json();
}

// ─── SYNC ─────────────────────────────────────────────────────────────────────
async function syncDados(){
  var tbody=document.getElementById('tbody');
  if(!tbody)return;
  tbody.innerHTML='<tr><td colspan="14" class="loading">Carregando produtos...</td></tr>';
  var debugBox=document.getElementById('debugBox');if(debugBox)debugBox.textContent='';
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  log('[Sync] Iniciando...');
  await sincronizarHora();
  try{
    // Produtos
    var produtos=[],pagina=1;
    while(true){
      if(pagina>1)await sleep(400);
      var r=await blingGet('/produtos?pagina='+pagina+'&limite=100&situacao=A');
      var items=r.data||[];produtos=produtos.concat(items);
      if(items.length<100)break;pagina++;if(pagina>30)break;
    }
    produtos=produtos.filter(function(p){
      if(!p.codigo||!String(p.codigo).startsWith('0'))return false;
      var nome=(p.nome||"").toLowerCase();
      return!nome.includes('kit');
    });
    log('[Produtos] filtrados: '+produtos.length);

    // Saldos por depósito
    tbody.innerHTML='<tr><td colspan="14" class="loading">Carregando saldos por depósito...</td></tr>';
    saldosDeposito={};
    var ids=produtos.map(function(p){return p.id;});
    for(var si=0;si<ids.length;si+=20){
      if(si>0)await sleep(400);
      var loteIds=ids.slice(si,si+20);
      var qs=loteIds.map(function(id){return'idsProdutos[]='+id;}).join('&');
      var rs=await blingGet('/estoques/saldos?'+qs);
      (rs.data||[]).forEach(function(item){
        var pid=item.produto&&item.produto.id;if(!pid)return;
        var fat=0,full=0;
        (item.depositos||[]).forEach(function(dep){
          if(dep.id===DEP_FATURAMENTO)fat=dep.saldoVirtual||0;
          else if(dep.id===DEP_FULFILLMENT)full=dep.saldoVirtual||0;
        });
        saldosDeposito[pid]={fat:fat,full:full};
      });
      log('[Saldos] lote '+(si/20+1)+': '+Object.keys(saldosDeposito).length+' produtos com saldo');
    }
    log('[Saldos] total: '+Object.keys(saldosDeposito).length);

    // Pedidos — sempre busca o período da tabela para exibição
    // O cache histórico é usado APENAS para os cards de vendas acumuladas
    tbody.innerHTML='<tr><td colspan="14" class="loading">Carregando pedidos...</td></tr>';
    var hoje=todayStr();
    // Para a tabela/gráfico: usa o maior período configurado entre chart e table
    var dataIniBusca=[chartPeriodo.ini, tablePeriodo.ini, config.dataInicio||daysAgoStr(30)].sort()[0];
    log('[Pedidos] buscando de '+dataIniBusca+' ate '+hoje);

    // Situações válidas como venda:
    // 15 = Em andamento (com NF), 21 = Em digitação (enviado fábrica), 529911 = Fulfillment ML
    // Excluídos: 12 (Cancelado), 724811 (Devolvido), 609955 (Avariado)
    var SITS=[
      {id:15,origem:'normal'},
      {id:21,origem:'normal'},
      {id:529911,origem:'fulfillment'}
    ];
    var listaIds=[];
    for(var si2=0;si2<SITS.length;si2++){
      if(si2>0)await sleep(400);
      pagina=1;
      while(true){
        if(pagina>1)await sleep(400);
        var rp=await blingGet('/pedidos/vendas?dataInicial='+dataIniBusca+'&dataFinal='+hoje+'&situacao='+SITS[si2].id+'&pagina='+pagina+'&limite=100');
        var ip=rp.data||[];
        ip.forEach(function(p){if(p.id)listaIds.push({id:p.id,data:p.data,origem:SITS[si2].origem});});
        log('[Pedidos] sit'+SITS[si2].id+' pag'+pagina+': '+ip.length+' itens');
        if(ip.length<100)break;pagina++;if(pagina>20)break;
      }
    }
    // Dedup: mesmo pedido pode aparecer em sit15 e sit21 (mesmo ID, fases diferentes)
    // Fulfillment tem prioridade; entre 15 e 21, mantém qualquer (mesmo pedido)
    var idMap={};
    listaIds.forEach(function(p){
      if(!idMap[p.id]||p.origem==='fulfillment')idMap[p.id]=p;
    });
    listaIds=Object.keys(idMap).map(function(k){return idMap[k];});
    log('[Pedidos] dedup: '+listaIds.length+' pedidos únicos');

    // Busca detalhes via servidor (evita rate limit no browser)
    pedidosBrutos=[];
    tbody.innerHTML='<tr><td colspan="14" class="loading">Buscando detalhes dos pedidos no servidor...</td></tr>';
    var todosIds=listaIds.map(function(r){return r.id;}).join(',');
    var idDataMap={};listaIds.forEach(function(r){idDataMap[r.id]=r.data;});

    // Divide em lotes de 50 IDs por chamada ao servidor
    var loteSize=50;
    for(var li=0;li<listaIds.length;li+=loteSize){
      var loteIds=listaIds.slice(li,li+loteSize).map(function(r){return r.id;}).join(',');
      var rs2=await fetch('/api/pedidos-detalhes?ids='+loteIds);
      if(rs2.status===401){renderLogin();throw new Error('Sessão expirada');}
      var json2=await rs2.json();
      (json2.data||[]).forEach(function(pedido){
        if(!pedido)return;
        if(!pedido.data)pedido.data=idDataMap[pedido.id]||'';
        var sitId=pedido.situacao&&pedido.situacao.id;
        pedido._origem=sitId===529911?'fulfillment':'normal';
        pedidosBrutos.push(pedido);
      });
      tbody.innerHTML='<tr><td colspan="14" class="loading">Buscando detalhes... '+Math.min(li+loteSize,listaIds.length)+'/'+listaIds.length+'</td></tr>';
    }
    log('[Pedidos] com itens: '+pedidosBrutos.length);

    // Atualiza cache histórico para os cards de vendas acumuladas
    var skuSetHist={};produtos.forEach(function(p){skuSetHist[String(p.codigo)]=true;});
    // Reseta e reconstrói do zero com os pedidos buscados
    histVendas.vendas={};histVendas.vendasFull={};
    pedidosBrutos.forEach(function(pedido){
      var itens=pedido.itens||pedido.item||[];
      itens.forEach(function(item){
        var codigo=extrairSku(item);if(!codigo)return;
        var qtdItem=parseFloat(item.quantidade||item.qtde||0);
        var comps=desmembrarKit(codigo,qtdItem);
        var lista=comps?comps:[{sku:codigo,qty:qtdItem}];
        lista.forEach(function(c){
          if(!skuSetHist[c.sku])return;
          if(pedido._origem==='fulfillment'){
            histVendas.vendasFull[c.sku]=(histVendas.vendasFull[c.sku]||0)+c.qty;
          }else{
            histVendas.vendas[c.sku]=(histVendas.vendas[c.sku]||0)+c.qty;
          }
        });
      });
    });
    histVendas.lastDate=hoje;
    try{localStorage.setItem('esq_hist',JSON.stringify(histVendas));}catch(e){}

    // dadosBase
    var categorias={};
    dadosBase=produtos.map(function(p){
      var sku=String(p.codigo);
      var estoque=p.estoque&&p.estoque.saldoVirtualTotal!=null?p.estoque.saldoVirtualTotal:0;
      var depSaldo=saldosDeposito[p.id]||{};
      var estoqueFat=depSaldo.fat!=null?depSaldo.fat:estoque;
      var estoqueFull2=depSaldo.full||0;
      var nl=(p.nome||"").toLowerCase();
      var cat=nl.includes('espreguiçadeira')||nl.includes('espreguicadeira')?'Espreguiçadeira':nl.includes('mesa')?'Mesa de Centro':'Outros';
      categorias[cat]=true;
      return{id:p.id,sku:sku,nome:p.nome||sku,categoria:cat,estoque:estoque,estoqueFat:estoqueFat,estoqueFull:estoqueFull2,customMin:false};
    });

    log('[dadosBase] montado: '+dadosBase.length+' produtos');
    dataInicioBuscada = dataIniBusca;
    var ls=document.getElementById('lastSync');
    if(ls)ls.textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR');
    recalcularTabela();
    renderChart();
    // Atualiza métricas se aba estiver ativa
    var tabMet=document.getElementById('tab_metricas');
    if(tabMet&&tabMet.style.display==='block')renderMetricas();
  }catch(err){
    log('[ERRO] '+err.message+'\n'+(err.stack||''));
    var db=document.getElementById('debugBox');if(db)db.style.display='block';
    var tb=document.getElementById('tbody');
    if(tb)tb.innerHTML='<tr><td colspan="14" class="empty">❌ Erro: '+err.message+' — Veja o Debug no topo para detalhes.</td></tr>';
  }
}

// ─── RECALCULAR ───────────────────────────────────────────────────────────────
function recalcularTabela(){
  if(!dadosBase.length)return;
  var skuSet={};dadosBase.forEach(function(d){skuSet[d.sku]=true;});
  var calc=calcularVendas(skuSet,tablePeriodo.ini,tablePeriodo.fim,tableOrigem,tablePeriodo.tipo);
  var vm=calc.vendasMap,vn=calc.vendasNormal,vf=calc.vendasFull;
  var periodo=periodoEmDias(tablePeriodo.ini,tablePeriodo.fim);
  var prazoFull=config.diasProducao+(config.diasLogFull||10);
  var soFat=tableOrigem==='normal', soFull=tableOrigem==='fulfillment';

  dados=dadosBase.map(function(b){
    var vnorm=vn[b.sku]||0, vful=vf[b.sku]||0;
    var estFat=b.estoqueFat||0, estFull=b.estoqueFull||0;

    // Quando filtrado por canal, usa só aquele canal
    var vendas  = soFat?vnorm : soFull?vful  : vnorm+vful;
    var estoque = soFat?estFat: soFull?estFull: estFat+estFull;
    var media   = vendas/periodo;
    var mediaNorm=vnorm/periodo, mediaFull=vful/periodo;

    var minFat=minimoCustom[b.sku]!=null?minimoCustom[b.sku]:Math.ceil((soFull?0:mediaNorm)*config.minDias);
    var minFull=minimoCustomFull[b.sku]!=null?minimoCustomFull[b.sku]:Math.ceil((soFat?0:mediaFull)*config.minDiasFull);
    var minTotal=soFat?minFat: soFull?minFull: minFat+minFull;

    var diasMin=media>0?Math.floor((estoque-minTotal)/media):999;
    var diasZero=media>0?Math.floor(estoque/media):999;
    var status=calcStatus(estoque,minTotal,diasZero,media);

    // Sugestão usa prazo do canal mais restritivo
    var prazo=soFull?prazoFull:soFat?config.diasProducao:Math.max(config.diasProducao,prazoFull);
    var diasAlvo=(soFull?config.baseSugFull:config.baseSug)==='zero'?diasZero:diasMin;
    var sugestao=media>0?calcSugestaoComPrazo(diasAlvo,prazo):null;

    return Object.assign({},b,{
      vendasTotal:vendas,vendasNormal:vnorm,vendasFull:vful,mediaDia:media,
      estoqueFat:estFat,estoqueFull:estFull,estoque:estoque,
      estoqueMin:minTotal,estoqueMinFat:minFat,estoqueMinFull:minFull,
      diasAteMin:diasMin,diasAteZero:diasZero,
      status:status,sugestao:sugestao,sugestaoInicio:sugestao?sugestao.diasAteInicio:999,
      _canal:'total'
    });
  });

  updateCards();
  atualizarColunasDeposito();
  renderTable();
  updatePeriodUI('table');
  updateOrigemUI('table');
}

// ─── CLASSIFICAÇÃO DE SKU ─────────────────────────────────────────────────────
var SKU_PRODUTO   = {'1':'Espreguiçadeira','2':'Mesa de Centro'};
var SKU_MATERIAL  = {'1':'Aço/Ferro','2':'Alumínio'};
var SKU_ESTRUTURA = {'1':'Preto Fosco','2':'Champagne'};
var SKU_ACABAMENTO= {'1':'Junco','2':'Acquaflex','3':'Tela Sling','4':'Resort'};
var SKU_COR       = {'1':'Preto','2':'Azul Marinho','3':'Tabaco','4':'Fendi','5':'Argila','6':'Verde-Oliva','7':'Marrom','8':'Estampada'};

function classificarSku(sku){
  // SKU: 0{prod}{mat}{estr}{acab}{cor} — 6 dígitos
  // ex: 011112 → s[0]=0, s[1]=1(Espr), s[2]=1(Aço), s[3]=1(PF), s[4]=1(Junco), s[5]=2(Azul)
  var s=String(sku);
  if(!s.startsWith('0')||s.length<6)return null;
  return{
    produto:  SKU_PRODUTO[s[1]]||'?',
    material: SKU_MATERIAL[s[2]]||'?',
    estrutura:SKU_ESTRUTURA[s[3]]||'?',
    acabamento:SKU_ACABAMENTO[s[4]]||'?',
    cor:      SKU_COR[s[5]]||'?'
  };
}

function classificarKit(codigo){
  // Retorna tipo do kit: 'unit', 'kit2', 'kit3', 'kit4', 'kit2m', 'kit4m'
  var s=String(codigo);
  if(!s.startsWith('KT'))return'unit';
  var resto=s.slice(2);
  var qtd=parseInt(resto[0],10);
  var temMesa=resto.includes('_');
  if(qtd===2)return temMesa?'kit2m':'kit2';
  if(qtd===3)return'kit3';
  if(qtd===4)return temMesa?'kit4m':'kit4';
  return'kit';
}

function renderMetricas(){
  renderMetricasPeriodoBtns();
  if(!pedidosBrutos.length){
    document.getElementById('metricasConteudo').innerHTML='<div class="loading">Carregue os dados primeiro</div>';
    return;
  }

  var dtIni,dtFim,compararSoData=false;
  if(metricasPeriodo.tipo==='hoje'){compararSoData=true;dtIni=todayStr();dtFim=todayStr();}
  else if(metricasPeriodo.tipo==='1d'){dtIni=new Date(hoursAgoStr(24));dtFim=new Date(agoraStr());}
  else{dtIni=new Date(metricasPeriodo.ini+'T00:00:00');dtFim=new Date(metricasPeriodo.fim+'T23:59:59');}

  // Acumula dados por pedido (para kits) e por SKU unitário (para o resto)
  var porTipo={},porEstrutura={},porAcabamentoEspr={},porAcabamentoMesa={},porCorEspr={},porCorMesa={},porKit={};
  var totalUnid=0,totalPedidos=0;
  var devolvidos=[],avariados=[];

  pedidosBrutos.forEach(function(pedido){
    var dataPedido=(pedido.data||'').slice(0,10);
    var passou=compararSoData?(dataPedido>=dtIni&&dataPedido<=dtFim):
      (extrairData(pedido)>=dtIni&&extrairData(pedido)<=dtFim);
    if(!passou)return;

    var sitId=pedido.situacao&&pedido.situacao.id;
    // Devolvidos e avariados — listar separado
    if(sitId===724811){devolvidos.push(pedido);return;}
    if(sitId===609955){avariados.push(pedido);return;}

    totalPedidos++;
    var itens=pedido.itens||pedido.item||[];

    // Composição de kits — usa item original (antes de desmembrar)
    itens.forEach(function(item){
      var cod=extrairSku(item);if(!cod)return;
      var qtd=parseFloat(item.quantidade||item.qtde||0);
      var tipoKit=classificarKit(cod);
      porKit[tipoKit]=(porKit[tipoKit]||0)+qtd;
    });

    // Métricas por produto unitário
    itens.forEach(function(item){
      var cod=extrairSku(item);if(!cod)return;
      var qtd=parseFloat(item.quantidade||item.qtde||0);
      var comps=desmembrarKit(cod,qtd);
      var lista=comps?comps:[{sku:cod,qty:qtd}];
      lista.forEach(function(c){
        var cl=classificarSku(c.sku);if(!cl||cl.produto==='?')return;
        totalUnid+=c.qty;
        porTipo[cl.produto]=(porTipo[cl.produto]||0)+c.qty;
        porEstrutura[cl.estrutura]=(porEstrutura[cl.estrutura]||0)+c.qty;
        if(cl.produto==='Espreguiçadeira'){
          porAcabamentoEspr[cl.acabamento]=(porAcabamentoEspr[cl.acabamento]||0)+c.qty;
          var chaveCor=cl.cor;
          porCorEspr[chaveCor]=(porCorEspr[chaveCor]||0)+c.qty;
        } else {
          porAcabamentoMesa[cl.acabamento]=(porAcabamentoMesa[cl.acabamento]||0)+c.qty;
          porCorMesa[cl.cor]=(porCorMesa[cl.cor]||0)+c.qty;
        }
      });
    });
  });

  // Resumo
  var resEl=document.getElementById('metricasResumo');
  if(resEl)resEl.textContent=totalUnid+' unidades · '+totalPedidos+' pedidos';

  // Renderiza cards
  var CORES_GRAF=['#0d2b35','#1d6a7a','#2a9d8f','#e9c46a','#f4a261','#e76f51','#a8dadc','#457b9d'];
  function pctBar(val,total,cor){
    var p=total>0?Math.round(val/total*100):0;
    return'<div class="metric-row">'+
      '<span class="metric-label" title="'+val+'">'+cor+'</span>'+
      '<div class="metric-bar-wrap"><div class="metric-bar" style="width:'+p+'%;background:'+CORES_GRAF[Object.keys(CORES_GRAF).indexOf(cor)%CORES_GRAF.length]+'"></div></div>'+
      '<span class="metric-val">'+val+'</span>'+
      '<span class="metric-pct">'+p+'%</span>'+
      '</div>';
  }
  function cardMetrica(titulo,dados,total){
    var entries=Object.entries(dados).sort(function(a,b){return b[1]-a[1];});
    var cores=['#0d2b35','#2a9d8f','#e9c46a','#f4a261','#e76f51','#457b9d','#a8dadc','#e63946'];
    var rows=entries.map(function(e,i){
      var p=total>0?Math.round(e[1]/total*100):0;
      return'<div class="metric-row">'+
        '<span class="metric-label" title="'+e[0]+'">'+e[0]+'</span>'+
        '<div class="metric-bar-wrap"><div class="metric-bar" style="width:'+p+'%;background:'+cores[i%cores.length]+'"></div></div>'+
        '<span class="metric-val">'+e[1]+'</span>'+
        '<span class="metric-pct">'+p+'%</span>'+
        '</div>';
    }).join('');
    return'<div class="metric-card"><h4>'+titulo+'</h4>'+rows+'</div>';
  }

  // Card de kits
  var KIT_LABELS={'unit':'Unitário','kit2':'Kit 2','kit2m':'Kit 2 + Mesa','kit3':'Kit 3','kit4':'Kit 4','kit4m':'Kit 4 + Mesa'};
  var totalKits=Object.values(porKit).reduce(function(s,v){return s+v;},0);
  var kitDados={};
  Object.entries(porKit).forEach(function(e){kitDados[KIT_LABELS[e[0]]||e[0]]=e[1];});

  // Cards de devolvidos/avariados
  function cardDevolucao(titulo,lista,cor){
    if(!lista.length)return'';
    var rows=lista.map(function(p){
      var itens=(p.itens||p.item||[]).map(function(i){return extrairSku(i);}).filter(Boolean).join(', ');
      return'<div class="dev-row"><span>'+(p.numero||p.id)+'</span><span style="color:#888;font-size:11px">'+itens+'</span><span style="color:'+cor+'">'+((p.data||'').slice(0,10))+'</span></div>';
    }).join('');
    return'<div class="dev-card"><h4 style="color:'+cor+'">'+titulo+' ('+lista.length+')</h4>'+rows+'</div>';
  }

  var html=
    '<div class="metric-grid">'+
    cardMetrica('Tipo de Produto',porTipo,totalUnid)+
    cardMetrica('Cor da Estrutura',porEstrutura,totalUnid)+
    cardMetrica('Modelo — Espreguiçadeira',porAcabamentoEspr,porTipo['Espreguiçadeira']||0)+
    cardMetrica('Modelo — Mesa de Centro',porAcabamentoMesa,porTipo['Mesa de Centro']||0)+
    cardMetrica('Cor — Espreguiçadeira',porCorEspr,porTipo['Espreguiçadeira']||0)+
    cardMetrica('Cor — Mesa de Centro',porCorMesa,porTipo['Mesa de Centro']||0)+
    cardMetrica('Composição de Kits',kitDados,totalKits)+
    '</div>'+
    cardDevolucao('Devolvidos',devolvidos,'#d97706')+
    cardDevolucao('Avariados',avariados,'#dc2626');

  document.getElementById('metricasConteudo').innerHTML=html;
}

// ─── SORT ─────────────────────────────────────────────────────────────────────
function sortBy(col){
  if(sortCol===col)sortDir*=-1;
  else{sortCol=col;sortDir=(col==='status'||col==='sku'||col==='categoria')?1:-1;}
  ['status','sku','categoria','vendasNormal','vendasFull','vendasTotal','mediaDia','estoque','estoqueMin','diasAteMin','diasAteZero','sugestaoInicio'].forEach(function(c){
    var el=document.getElementById('srt_'+c);
    if(el)el.textContent=c===sortCol?(sortDir===1?'▲':'▼'):'';
  });
  renderTable();
}

// ─── EDIÇÃO INLINE DO MÍNIMO ─────────────────────────────────────────────────
function startEditMin(sku,el,canal){
  if(el.querySelector('input'))return;
  var map=canal==='full'?minimoCustomFull:minimoCustom;
  var d=dados.find(function(x){return x.sku===sku&&x._canal===canal;});
  var atual=map[sku]!=null?map[sku]:Math.ceil((d?d.mediaDia:0)*(canal==='full'?config.diasFull:config.minDias));
  var input=document.createElement('input');
  input.type='number';input.value=atual;input.min=0;
  input.onclick=function(e){e.stopPropagation();};
  input.onblur=function(){commitEditMin(sku,input.value,canal);};
  input.onkeydown=function(e){if(e.key==='Enter')input.blur();if(e.key==='Escape'){renderTable();}};
  el.textContent='';el.appendChild(input);
  setTimeout(function(){input.focus();input.select();},10);
}
function commitEditMin(sku,val,canal){
  var v=parseInt(val);
  var map=canal==='full'?minimoCustomFull:minimoCustom;
  var key=canal==='full'?'esq_min_full':'esq_min';
  if(!isNaN(v)&&v>=0){
    if(v===0)delete map[sku];
    else map[sku]=v;
    localStorage.setItem(key,JSON.stringify(map));
  }
  recalcularTabela();
}

// ─── TABELA ───────────────────────────────────────────────────────────────────
function renderTable(){
  var busca=((document.getElementById('busca')||{}).value||'').toLowerCase();
  var fStatus=(document.getElementById('fStatus')||{}).value||''
  var fCat=(document.getElementById('fCategoria')||{}).value||''
  var chkZero=(document.getElementById('chkZero')||{}).checked||false;
  var rows=dados.filter(function(d){
    if(busca&&d.sku.toLowerCase().indexOf(busca)<0&&d.nome.toLowerCase().indexOf(busca)<0)return false;
    if(fStatus&&d.status!==fStatus)return false;
    if(fCat&&d.categoria!==fCat)return false;
    if(chkZero&&d.vendasTotal===0&&d.estoque===0)return false;
    return true;
  });
  rows.sort(function(a,b){
    var av=a[sortCol],bv=b[sortCol];
    if(sortCol==='status'){var o={critico:0,atencao:1,ok:2};av=o[a.status];bv=o[b.status];}
    if(sortCol==='diasAteMin'||sortCol==='diasAteZero'||sortCol==='sugestaoInicio'){
      if(av>=999&&bv>=999)return 0;if(av>=999)return 1;if(bv>=999)return -1;
    }
    if(typeof av==='string')return sortDir*av.localeCompare(bv);
    return sortDir*((av||0)-(bv||0));
  });
  var tbody=document.getElementById('tbody');if(!tbody)return;
  if(!rows.length){tbody.innerHTML='<tr><td colspan="14" class="empty">Nenhum produto encontrado</td></tr>';return;}

  function badge(s){
    if(s==='critico')return'<span class="badge critico"><span class="dot"></span>Crítico</span>';
    if(s==='atencao')return'<span class="badge atencao"><span class="dot"></span>Atenção</span>';
    return'<span class="badge ok"><span class="dot"></span>OK</span>';
  }
  function diasBadge(dias){
    if(dias>=999||dias<0)return'<span style="color:#ccc">-</span>';
    var cls=dias<=7?'dias-r':dias<=30?'dias-a':'dias-g';
    var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+Math.floor(dias));
    return'<span class="dias-badge '+cls+'" title="em '+dias+' dias">'+fmtDate(dateToStr(d))+'</span>';
  }
  function sugBadge(sug){
    if(!sug)return'<span style="color:#ccc">-</span>';
    var dt=fmtDate(dateToStr(sug.dataInicio));
    if(sug.atrasado)return'<span class="sug-badge sug-late" title="Deveria ter iniciado">Atrasado</span>';
    var cls=sug.diasAteInicio<=7?'sug-warn':'sug-ok';
    return'<span class="sug-badge '+cls+'" title="Iniciar em '+sug.diasAteInicio+' dias">'+dt+'</span>';
  }

  var html='';
  rows.forEach(function(d){
    var soFat=tableOrigem==='normal', soFull=tableOrigem==='fulfillment';
    var minFatCustom=minimoCustom[d.sku], minFullCustom=minimoCustomFull[d.sku];
    var minFatVal=minFatCustom!=null?minFatCustom:d.estoqueMinFat;
    var minFullVal=minFullCustom!=null?minFullCustom:d.estoqueMinFull;
    // Tooltip de estoque
    var estoqueTooltip=(!soFat&&!soFull)?'Fat: '+(d.estoqueFat||0)+' | Full: '+(d.estoqueFull||0)+' | Total: '+d.estoque:'';
    var estoqueStr=d.estoque>0?d.estoque:'-';
    // Tooltip de mínimo — mostra detalhamento Fat+Full
    var minTooltip=(!soFat&&!soFull)?'Fat: '+minFatVal+' | Full: '+minFullVal+' | Total: '+d.estoqueMin:'';
    var minStr=d.estoqueMin>0?d.estoqueMin:'-';
    // Mínimo editável — clique abre edição do canal relevante
    var minCanal=soFull?'full':'fat';
    var nomeEsc=d.nome.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    html+=
      '<tr>'+
      '<td>'+badge(d.status)+'</td>'+
      '<td><span class="tag">'+d.sku+'</span></td>'+
      '<td style="max-width:200px;cursor:pointer" onclick="toggleNome(this)" title="Clique para expandir"><span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+d.nome+'</span></td>'+
      '<td style="color:#888;font-size:11px">'+d.categoria+'</td>'+
      '<td style="text-align:right" class="col_vendasNormal"><span style="color:#16a34a;font-weight:600">'+(d.vendasNormal||0)+'</span></td>'+
      '<td style="text-align:right" class="col_vendasFull"><span style="color:#f59e0b;font-weight:600">'+(d.vendasFull||0)+'</span></td>'+
      '<td style="text-align:right;font-weight:600" class="col_vendasTotal">'+d.vendasTotal+'</td>'+
      '<td style="text-align:right">'+(d.mediaDia>0?d.mediaDia.toFixed(2):'-')+'</td>'+
      '<td style="text-align:right;font-weight:600" title="'+estoqueTooltip+'">'+estoqueStr+'</td>'+
      '<td style="text-align:right;cursor:pointer" class="min-cell" onclick="startEditMin(\''+d.sku+'\',this,\''+minCanal+'\')" title="'+(minTooltip||'Clique para editar')+'">'+minStr+'</td>'+
      '<td>'+diasBadge(d.diasAteMin)+'</td>'+
      '<td>'+diasBadge(d.diasAteZero)+'</td>'+
      '<td>'+sugBadge(d.sugestao)+'</td>'+
      '</tr>';
  });
  tbody.innerHTML=html;
}

function toggleNome(td){
  var span=td.querySelector('span');if(!span)return;
  if(span.style.whiteSpace==='normal'){
    span.style.whiteSpace='nowrap';span.style.overflow='hidden';span.style.textOverflow='ellipsis';td.style.maxWidth='200px';
  }else{
    span.style.whiteSpace='normal';span.style.overflow='visible';span.style.textOverflow='unset';td.style.maxWidth='360px';
  }
}

init();
</script>
