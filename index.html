<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
var config = JSON.parse(localStorage.getItem('esq_cfg') || '{"periodo":30,"minDias":15,"diasProducao":3}');
if (!config.diasProducao) config.diasProducao = 3;
var minimoCustom = JSON.parse(localStorage.getItem('esq_min') || '{}');
var dados = [];
var chartObj = null;
var editSku = null;
var pedidosBrutos = [];
var sortCol = 'status';   // coluna atual de ordenação
var sortDir = 1;          // 1=asc, -1=desc

// ─── FERIADOS NACIONAIS BRASIL (ano atual e próximo) ───────────────────────
// Formato: "MM-DD" (fixos) + calculados por ano
function feriadosAno(ano) {
  // Páscoa (algoritmo de Meeus/Jones/Butcher)
  var a=ano%19,b=Math.floor(ano/100),c=ano%100;
  var d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  var g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  var i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  var m=Math.floor((a+11*h+22*l)/451);
  var mes=Math.floor((h+l-7*m+114)/31);
  var dia=(h+l-7*m+114)%31+1;
  var pascoa=new Date(ano,mes-1,dia);
  function addDias(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
  var fixos=[
    ano+'-01-01',ano+'-04-21',ano+'-05-01',ano+'-09-07',
    ano+'-10-12',ano+'-11-02',ano+'-11-15',ano+'-12-25'
  ];
  function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var moveis=[
    fmt(addDias(pascoa,-48)), // Carnaval 2a
    fmt(addDias(pascoa,-47)), // Carnaval 3a
    fmt(addDias(pascoa,-2)),  // Sexta Santa
    fmt(pascoa),              // Pascoa
    fmt(addDias(pascoa,60)),  // Corpus Christi
  ];
  var set={};
  fixos.concat(moveis).forEach(function(d){set[d]=true;});
  return set;
}
var FERIADOS = Object.assign({}, feriadosAno(new Date().getFullYear()), feriadosAno(new Date().getFullYear()+1));

function isFeriado(d) {
  var s = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return !!FERIADOS[s];
}

// ─── CALENDÁRIO DE PRODUÇÃO ────────────────────────────────────────────────
// Produção (estrutura): seg-sex, NÃO trabalha em feriados
function isDiaProducao(d) {
  var dow = d.getDay(); // 0=dom,6=sab
  if (dow === 0 || dow === 6) return false;
  if (isFeriado(d)) return false;
  return true;
}

// Trançado: seg-sab + feriados (exceto domingo)
function isDiaTrancado(d) {
  if (d.getDay() === 0) return false; // para no domingo
  return true; // seg-sab, feriados OK
}

// Avança N dias úteis de produção a partir de uma data
function avancarDiasProducao(dataInicio, nDias) {
  var d = new Date(dataInicio);
  var count = 0;
  while (count < nDias) {
    d.setDate(d.getDate() + 1);
    if (isDiaProducao(d)) count++;
  }
  return d;
}

// A partir do fim da produção, avança N dias de trançado (seg-sab+feriado)
// Como trançado começa no mesmo dia que termina a produção, retorna a data
// em que N dias de trançado são completados (ex: 1 dia = mesmo dia se for dia de trançado)
function avancarDiasTrancado(dataInicio, nDias) {
  var d = new Date(dataInicio);
  var count = 0;
  // O dia de início conta se for dia de trançado
  if (isDiaTrancado(d)) count++;
  while (count < nDias) {
    d.setDate(d.getDate() + 1);
    if (isDiaTrancado(d)) count++;
  }
  return d;
}

// Calcula data de prontidão do pedido de reposição:
// diasProducao dias úteis de produção + 1 dia de trançado (no mesmo dia que termina produção)
// Retorna { dataFimProducao, dataPronta, diasCorridosTotais }
function calcDataPronta(diasEstoqueRestam) {
  // Hoje + diasEstoqueRestam = data em que o estoque vai acabar (ou chegar no mínimo)
  var hoje = new Date();
  hoje.setHours(0,0,0,0);

  // Data em que o pedido precisa ficar pronto: quando o estoque atingir o mínimo
  var dataLimite = new Date(hoje);
  dataLimite.setDate(dataLimite.getDate() + Math.max(0, Math.floor(diasEstoqueRestam)));

  // Simula: se pedir hoje, quando fica pronto?
  var fimProducao = avancarDiasProducao(hoje, config.diasProducao);
  // Trançado começa no mesmo dia que termina a produção (1 dia = finaliza no mesmo dia)
  var dataPronta = avancarDiasTrancado(fimProducao, 1);

  // Dias corridos da data atual até ficar pronto
  var diasCorridos = Math.round((dataPronta - hoje) / 86400000);

  return {
    dataFimProducao: fimProducao,
    dataPronta: dataPronta,
    diasCorridos: diasCorridos,
    // true se vai ficar pronto ANTES do estoque acabar
    aPrazo: dataPronta <= dataLimite
  };
}

// ─── UTILITÁRIOS ──────────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().split('T')[0];}
function daysAgoStr(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0];}
function fmtDate(dateStr){
  if(!dateStr)return'-';
  var p=dateStr.split('-');
  return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:dateStr;
}
function dateToStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Desmembra código de kit em itens individuais com quantidade
// Padrão: KT{qtd}{SKU_espreguicadeira}_{SKU_mesa}
// Ex: KT2011224_021224 => [{sku:'011224', qty:2}, {sku:'021224', qty:1}]
function desmembrarKit(codigo, qtdPedido) {
  if (!codigo || !String(codigo).startsWith('KT')) return null;
  var s = String(codigo).slice(2); // remove 'KT'
  var idx = s.indexOf('_');
  if (idx < 0) return null;
  var parteEspr = s.slice(0, idx); // ex: '2011224'
  var skuMesa   = s.slice(idx + 1); // ex: '021224'
  // Extrai qtd numérica do início (pode ser 1, 2, 3...)
  var match = parteEspr.match(/^(\d+?)(\d{6})$/); // qtd + 6 dígitos de SKU
  if (!match) {
    // Tenta com SKU de tamanho variável: primeiro dígito = qtd, resto = SKU
    var qtdEspr = parseInt(parteEspr[0], 10);
    var skuEspr = parteEspr.slice(1);
    if (isNaN(qtdEspr) || !skuEspr) return null;
    return [
      { sku: skuEspr,  qty: qtdEspr * qtdPedido },
      { sku: skuMesa,  qty: 1      * qtdPedido }
    ];
  }
  return [
    { sku: match[2], qty: parseInt(match[1], 10) * qtdPedido },
    { sku: skuMesa,  qty: 1 * qtdPedido }
  ];
}

function extrairSku(item){
  if(!item)return'';
  if(item.codigo)return String(item.codigo);
  if(item.produto&&item.produto.codigo)return String(item.produto.codigo);
  if(item.sku)return String(item.sku);
  return'';
}
function extrairData(pedido){
  var raw=pedido.data||pedido.dataPedido||pedido.dataEmissao||'';
  if(!raw)return new Date(0);
  try{return raw.includes('T')?new Date(raw):new Date(raw+'T12:00:00');}
  catch(e){return new Date(0);}
}

function calcularVendas(skuSet, dataIni, dataFim){
  var dtIni=new Date(dataIni+'T00:00:00');
  var dtFim=new Date(dataFim+'T23:59:59');
  var corte7d=new Date();corte7d.setDate(corte7d.getDate()-7);corte7d.setHours(0,0,0,0);
  var vm={},v7={};
  pedidosBrutos.forEach(function(pedido){
    var dt=extrairData(pedido);
    if(dt<dtIni||dt>dtFim)return;
    var itens=pedido.itens||pedido.item||[];
    itens.forEach(function(item){
      var codigo=extrairSku(item);
      if(!codigo)return;
      var qtdItem=parseFloat(item.quantidade||item.qtde||0);

      // Tenta desmembrar kit
      var componentes=desmembrarKit(codigo, qtdItem);
      if(componentes){
        // É um kit — distribui pelas SKUs componentes
        componentes.forEach(function(c){
          if(!skuSet[c.sku])return;
          vm[c.sku]=(vm[c.sku]||0)+c.qty;
          if(dt>=corte7d)v7[c.sku]=(v7[c.sku]||0)+c.qty;
        });
      } else {
        // Produto simples
        if(!skuSet[codigo])return;
        vm[codigo]=(vm[codigo]||0)+qtdItem;
        if(dt>=corte7d)v7[codigo]=(v7[codigo]||0)+qtdItem;
      }
    });
  });
  return{vendasMap:vm,vendas7dMap:v7};
}

// ─── MODAIS ────────────────────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.addEventListener('click',function(e){if(e.target.classList.contains('modal-bg'))e.target.classList.remove('open');});

function saveConfig(){
  config.periodo=parseInt(document.getElementById('cfgPeriodo').value)||30;
  config.minDias=parseInt(document.getElementById('cfgMinDias').value)||15;
  config.diasProducao=parseInt(document.getElementById('cfgDiasProducao').value)||3;
  localStorage.setItem('esq_cfg',JSON.stringify(config));
  closeModal('modalConfig');
  if(dados.length>0){updateCards();renderChart();renderTable();}
}
function openConfig(){
  document.getElementById('cfgPeriodo').value=config.periodo;
  document.getElementById('cfgMinDias').value=config.minDias;
  document.getElementById('cfgDiasProducao').value=config.diasProducao;
  openModal('modalConfig');
}
function openEditMin(sku,nome){
  editSku=sku;
  document.getElementById('modalMinNome').textContent=nome;
  document.getElementById('modalMinVal').value=minimoCustom[sku]||0;
  openModal('modalMin');
}
function saveMin(){
  var val=parseInt(document.getElementById('modalMinVal').value)||0;
  if(val>0)minimoCustom[editSku]=val;else delete minimoCustom[editSku];
  localStorage.setItem('esq_min',JSON.stringify(minimoCustom));
  closeModal('modalMin');
  recalcularProduto(editSku);
  updateCards();renderChart();renderTable();
}

function calcStatus(estoque,estoqueMin,diasAteZero,mediaDia){
  if(mediaDia<=0)return'ok';
  if(estoque<=estoqueMin||diasAteZero<=7)return'critico';
  if(diasAteZero<=30)return'atencao';
  return'ok';
}

function recalcularProduto(sku){
  dados=dados.map(function(d){
    if(d.sku!==sku)return d;
    var estoqueMin=minimoCustom[sku]?minimoCustom[sku]:Math.ceil(d.mediaDia*config.minDias);
    var diasAteMin=d.mediaDia>0?Math.floor((d.estoque-estoqueMin)/d.mediaDia):999;
    var diasAteZero=d.mediaDia>0?Math.floor(d.estoque/d.mediaDia):999;
    var status=calcStatus(d.estoque,estoqueMin,diasAteZero,d.mediaDia);
    return Object.assign({},d,{estoqueMin,diasAteMin,diasAteZero,status,customMin:!!minimoCustom[sku]});
  });
}

// ─── INIT ──────────────────────────────────────────────────────────────────

    var r=await fetch('/auth/status');
    var s=await r.json();
    if(s.authenticated)renderPainel();else renderLogin();
  }catch(e){renderLogin();}
}

    '</div>'+
    '<div id="debugBox" class="debug-box"></div>'+
    '<div class="chart-wrap">'+
    '<div class="chart-header">'+
    '<h3>&#x1F4CA; Vendas por Produto</h3>'+
    '<select id="chartCat" onchange="renderChart()"><option value="">Todas as categorias</option></select>'+
    '</div>'+
    '<canvas id="grafico" height="90"></canvas>'+
    '</div>'+

    '<select id="fCategoria" onchange="renderTable()"><option value="">Todas as categorias</option></select>'+

    '<th onclick="sortBy('vendasTotal')" style="cursor:pointer;text-align:right">Vendas Total <span id="srt_vendasTotal"></span></th>'+
    '<th onclick="sortBy('mediaDia')" style="cursor:pointer;text-align:right">Media/dia <span id="srt_mediaDia"></span></th>'+
    '<th onclick="sortBy('estoque')" style="cursor:pointer;text-align:right">Estoque <span id="srt_estoque"></span></th>'+
    '<th onclick="sortBy('estoqueMin')" style="cursor:pointer;text-align:right">Est. Minimo <span id="srt_estoqueMin"></span></th>'+
    '<th onclick="sortBy('diasAteMin')" style="cursor:pointer" title="Data prevista para atingir o estoque minimo">Atinge Minimo <span id="srt_diasAteMin"></span></th>'+
    '<th onclick="sortBy('diasAteZero')" style="cursor:pointer" title="Data prevista para zerar o estoque">Zera Estoque <span id="srt_diasAteZero"></span></th>'+
    '<th title="Data em que o lote ficara pronto ('+config.diasProducao+'du producao + trancado)">Pronto em</th>'+
    '</tr></thead>'+
    '<tbody id="tbody"><tr><td colspan="12" class="loading">Clique em Atualizar para carregar os dados</td></tr></tbody>'+
    '</table></div>';
}

function toggleDebug(){
  var b=document.getElementById('debugBox');
  if(b)b.style.display=b.style.display==='block'?'none':'block';
}

// Recalcula vendas, tabela e gráfico para o período selecionado sem buscar a API novamente
function aplicarPeriodo(){
  if(!pedidosBrutos.length){alert('Clique em Atualizar primeiro para carregar os dados.');return;}
  var dataIni=(document.getElementById('periodoIni')||{}).value||daysAgoStr(config.periodo);
  var dataFim=(document.getElementById('periodoFim')||{}).value||todayStr();
  var periodo=Math.max(1,Math.round((new Date(dataFim+'T23:59:59')-new Date(dataIni+'T00:00:00'))/86400000));

  var skuSet={};
  dados.forEach(function(d){skuSet[d.sku]=true;});
  var calc=calcularVendas(skuSet,dataIni,dataFim);
  var vendasMap=calc.vendasMap;
  var vendas7dMap=calc.vendas7dMap;

  dados=dados.map(function(d){
    var vendasTotal=vendasMap[d.sku]||0;
    var vendas7d=vendas7dMap[d.sku]||0;
    var mediaDia=periodo>0?vendasTotal/periodo:0;
    var estoqueMin=minimoCustom[d.sku]?minimoCustom[d.sku]:Math.ceil(mediaDia*config.minDias);
    var diasAteMin=mediaDia>0?Math.floor((d.estoque-estoqueMin)/mediaDia):999;
    var diasAteZero=mediaDia>0?Math.floor(d.estoque/mediaDia):999;
    var status=calcStatus(d.estoque,estoqueMin,diasAteZero,mediaDia);
    var infoProd=mediaDia>0?calcDataPronta(diasAteMin):null;
    return Object.assign({},d,{vendasTotal,vendas7d,mediaDia,estoqueMin,diasAteMin,diasAteZero,status,infoProd});
  });

  updateCards(); renderChart(); renderTable();
  var ls=document.getElementById('lastSync');
  if(ls) ls.textContent='Periodo: '+dataIni.split('-').reverse().join('/')+' a '+dataFim.split('-').reverse().join('/');
}

function log(msg){
  console.log(msg);
  var b=document.getElementById('debugBox');
  if(b){b.innerHTML+=msg+'<br>';b.scrollTop=b.scrollHeight;}
}

async function blingGet(path){
  var r=await fetch('/api/bling'+path);
  if(r.status===401){renderLogin();throw new Error('Sessao expirada');}
  return r.json();
}

async function syncDados(){
  var tbody=document.getElementById('tbody');
  if(!tbody)return;
  tbody.innerHTML='<tr><td colspan="12" class="loading">Carregando produtos...</td></tr>';
  var debugBox=document.getElementById('debugBox');
  if(debugBox)debugBox.innerHTML='';

  try{
    // 1. Buscar produtos
    var produtos=[];
    var pagina=1;
    function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
    while(true){
      if(pagina>1) await sleep(400);
      var r=await blingGet('/produtos?pagina='+pagina+'&limite=100&situacao=A');
      var items=r.data||[];
      produtos=produtos.concat(items);
      if(items.length<100)break;
      pagina++;if(pagina>30)break;
    }
    log('[Produtos] Total bruto: '+produtos.length);
    if(produtos.length===0){
      log('[Produtos] AVISO: nenhum produto. Verificando primeira pagina...');
      var rDbg=await blingGet('/produtos?pagina=1&limite=5&situacao=A');
      log('[Produtos raw] '+JSON.stringify(rDbg).slice(0,400));
    } else {
      // Loga campos do primeiro produto para entender estrutura
      log('[Produto #1] chaves: '+Object.keys(produtos[0]).join(', '));
      log('[Produto #1] codigo="'+produtos[0].codigo+'" nome="'+(produtos[0].nome||'').slice(0,40)+'"');
    }

    produtos=produtos.filter(function(p){
      if(!p.codigo||!String(p.codigo).startsWith('0'))return false;
      return!(p.nome||'').toLowerCase().includes('kit');
    });
    log('[Produtos] Apos filtro: '+produtos.length);

    // 2. Buscar pedidos
    tbody.innerHTML='<tr><td colspan="12" class="loading">Carregando vendas...</td></tr>';
    var hoje=new Date();
    var dataFim=hoje.toISOString().split('T')[0];
    var dataIni=new Date(hoje.getTime()-config.periodo*86400000).toISOString().split('T')[0];

    // 2a. Buscar lista de pedidos (sem itens)
    var listaIds=[];
    var listaPedidos=[];
    pagina=1;
    while(true){
      if(pagina>1) await sleep(400);
      var rp=await blingGet('/pedidos/vendas?dataInicial='+dataIni+'&dataFinal='+dataFim+'&situacao=6&pagina='+pagina+'&limite=100');
      var ip=rp.data||[];
      listaPedidos=listaPedidos.concat(ip);
      ip.forEach(function(p){if(p.id)listaIds.push({id:p.id,data:p.data});});
      if(ip.length<100)break;
      pagina++;if(pagina>20)break;
    }
    log('[Pedidos] Lista: '+listaIds.length+' pedidos, buscando itens...');
    tbody.innerHTML='<tr><td colspan="12" class="loading">Buscando itens dos pedidos ('+listaIds.length+')...</td></tr>';

    // 2b. Buscar cada pedido individualmente — lotes de 3 com 400ms de delay (rate limit: 3 req/s)
    pedidosBrutos=[];
    var LOTE=3, DELAY=500;
    function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
    for(var i=0;i<listaIds.length;i+=LOTE){
      if(i>0) await sleep(DELAY);
      var lote=listaIds.slice(i,i+LOTE);
      var resultados=await Promise.all(lote.map(function(ref){
        return blingGet('/pedidos/vendas/'+ref.id).then(function(res){
          if(res&&res.data&&!res.data.error){
            var pedido=res.data;
            if(!pedido.data&&ref.data)pedido.data=ref.data;
            return pedido;
          }
          log('[Pedido erro] id='+ref.id+' | '+JSON.stringify(res).slice(0,150));
          return null;
        }).catch(function(e){return null;});
      }));
      resultados.forEach(function(p){if(p)pedidosBrutos.push(p);});
      var pct=Math.min(i+LOTE,listaIds.length);
      tbody.innerHTML='<tr><td colspan="12" class="loading">Buscando itens... '+pct+'/'+listaIds.length+'</td></tr>';
    }

    // Log da estrutura do primeiro pedido detalhado
    if(pedidosBrutos.length>0){
      var p0=pedidosBrutos[0];
      log('[Pedido detalhe #1] chaves: '+Object.keys(p0).join(', '));
      var it0=p0.itens||p0.item||[];
      log('[Pedido detalhe #1] itens='+it0.length+' | data="'+p0.data+'"');
      if(it0.length>0)log('[Item #1] '+JSON.stringify(it0[0]).slice(0,300));
    }
    log('[Pedidos] Com itens: '+pedidosBrutos.length);

    // 3. Calcular vendas no período padrão
    var skuSet={};
    produtos.forEach(function(p){skuSet[String(p.codigo)]=true;});

    // Log de diagnóstico: compara SKUs dos itens com skuSet
    var skusNosItens={};
    pedidosBrutos.forEach(function(pedido){
      var itens=pedido.itens||pedido.item||[];
      itens.forEach(function(item){
        var s=extrairSku(item);
        if(s)skusNosItens[s]=true;
      });
    });
    var skusItensArr=Object.keys(skusNosItens);
    log('[SKUs nos itens] total='+skusItensArr.length+' | exemplos: '+skusItensArr.slice(0,5).join(', '));
    log('[SKUs produtos]  total='+Object.keys(skuSet).length+' | exemplos: '+Object.keys(skuSet).slice(0,5).join(', '));
    var matches=skusItensArr.filter(function(s){return skuSet[s];});
    log('[Match SKUs] '+matches.length+' coincidencias | exemplos: '+matches.slice(0,5).join(', '));

    var calc=calcularVendas(skuSet,dataIni,dataFim);
    var vendasMap=calc.vendasMap;
    var vendas7dMap=calc.vendas7dMap;
    log('[Vendas] SKUs com venda: '+Object.keys(vendasMap).length);

    // 4. Montar dados com cálculo de datas de produção
    var categorias={};
    dados=produtos.map(function(p){
      var sku=String(p.codigo);
      var estoque=p.estoque&&p.estoque.saldoVirtualTotal!=null?p.estoque.saldoVirtualTotal:0;
      var vendasTotal=vendasMap[sku]||0;
      var vendas7d=vendas7dMap[sku]||0;
      var periodoReal=Math.max(1,Math.round((new Date(dataFim+'T23:59:59')-new Date(dataIni+'T00:00:00'))/86400000));
      var mediaDia=periodoReal>0?vendasTotal/periodoReal:0;
      var estoqueMin=minimoCustom[sku]?minimoCustom[sku]:Math.ceil(mediaDia*config.minDias);
      var diasAteMin=mediaDia>0?Math.floor((estoque-estoqueMin)/mediaDia):999;
      var diasAteZero=mediaDia>0?Math.floor(estoque/mediaDia):999;
      var nomeLC=(p.nome||'').toLowerCase();
      var categoria=
        nomeLC.includes('espreguicadeira')||nomeLC.includes('espreguiçadeira')?'Espreguicadeira':
        nomeLC.includes('mesa')?'Mesa de Apoio':
        (p.categoria&&p.categoria.descricao)?p.categoria.descricao:'Outros';
      categorias[categoria]=true;
      var status=calcStatus(estoque,estoqueMin,diasAteZero,mediaDia);

      // Calcula data de prontidão baseada em quando o estoque atinge o mínimo
      var infoProd = mediaDia>0 ? calcDataPronta(diasAteMin) : null;

      return{id:p.id,sku,nome:p.nome||sku,categoria,vendas7d,vendasTotal,mediaDia,
        estoque,estoqueMin,diasAteMin,diasAteZero,status,customMin:!!minimoCustom[sku],
        infoProd};
    });

    // 5. Popular selects
    ['fCategoria','chartCat'].forEach(function(id){
      var sel=document.getElementById(id);
      if(!sel)return;
      sel.innerHTML='<option value="">Todas as categorias</option>';
      Object.keys(categorias).sort().forEach(function(c){
        sel.innerHTML+='<option value="'+c+'">'+c+'</option>';
      });
    });

    updateCards();renderChart();renderTable();
    var ls=document.getElementById('lastSync');
    if(ls)ls.textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR');

  }catch(err){
    log('[ERRO] '+err.message);
    var tb=document.getElementById('tbody');
    if(tb)tb.innerHTML='<tr><td colspan="12" class="empty">Erro: '+err.message+'</td></tr>';
  }
}

function updateCards(){
  var el=function(id){return document.getElementById(id);};
  if(el('cTotal'))el('cTotal').textContent=dados.length;
  if(el('cCritico'))el('cCritico').textContent=dados.filter(function(d){return d.status==='critico';}).length;
  if(el('cAtencao'))el('cAtencao').textContent=dados.filter(function(d){return d.status==='atencao';}).length;
  if(el('cOk'))el('cOk').textContent=dados.filter(function(d){return d.status==='ok';}).length;
}

function renderChart(){
  var canvas=document.getElementById('grafico');
  if(!canvas)return;
  var dataIni=(document.getElementById('periodoIni')||{}).value||daysAgoStr(config.periodo);
  var dataFim=(document.getElementById('periodoFim')||{}).value||todayStr();
  var catFiltro=(document.getElementById('chartCat')||{}).value||'';

  var skuSet={};
  dados.forEach(function(d){skuSet[d.sku]=true;});
  var calc=calcularVendas(skuSet,dataIni,dataFim);
  var vm=calc.vendasMap;

  var base=catFiltro?dados.filter(function(d){return d.categoria===catFiltro;}):dados;
  var comVenda=base.filter(function(d){return(vm[d.sku]||0)>0;});
  var top=comVenda.length>0
    ?comVenda.slice().sort(function(a,b){return(vm[b.sku]||0)-(vm[a.sku]||0);}).slice(0,20)
    :base.slice().sort(function(a,b){return b.estoque-a.estoque;}).slice(0,20);

  var label=comVenda.length>0?'Vendas no periodo':'Estoque atual (sem vendas no periodo)';
  var cores=top.map(function(d){
    return d.status==='critico'?'rgba(220,38,38,0.75)':d.status==='atencao'?'rgba(217,119,6,0.75)':'rgba(22,163,74,0.75)';
  });

  if(chartObj)chartObj.destroy();
  chartObj=new Chart(canvas,{
    type:'bar',
    data:{
      labels:top.map(function(d){return d.sku;}),
      datasets:[{label,data:top.map(function(d){return comVenda.length>0?(vm[d.sku]||0):d.estoque;}),backgroundColor:cores,borderRadius:5}]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{position:'top'},
        tooltip:{callbacks:{
          title:function(items){
            var d=top[items[0].dataIndex];
            return d.nome; // nome completo no tooltip
          },
          label:function(ctx){
            var d=top[ctx.dataIndex];
            return' Vendas: '+ctx.parsed.y+'  |  Media/dia: '+(d.mediaDia>0?d.mediaDia.toFixed(2):'-')+'  |  Estoque: '+d.estoque;
          }
        }}
      },
      scales:{y:{beginAtZero:true,title:{display:true,text:'Unidades'}}}
    }
  });
}

function sortBy(col){
  if(sortCol===col){ sortDir*=-1; }
  else { sortCol=col; sortDir=col==='status'||col==='sku'||col==='categoria'?1:-1; }
  // Atualiza indicadores visuais
  ['status','sku','categoria','vendas7d','vendasTotal','mediaDia','estoque','estoqueMin','diasAteMin','diasAteZero'].forEach(function(c){
    var el=document.getElementById('srt_'+c);
    if(el)el.textContent=c===sortCol?(sortDir===1?'▲':'▼'):'';
  });
  renderTable();
}

function renderTable(){
  var busca=((document.getElementById('busca')||{}).value||'').toLowerCase();
  var fStatus=(document.getElementById('fStatus')||{}).value||'';
  var fCat=(document.getElementById('fCategoria')||{}).value||'';
  var chkZero=(document.getElementById('chkZero')||{}).checked||false;

  var rows=dados.filter(function(d){
    if(busca&&d.sku.toLowerCase().indexOf(busca)<0&&d.nome.toLowerCase().indexOf(busca)<0)return false;
    if(fStatus&&d.status!==fStatus)return false;
    if(fCat&&d.categoria!==fCat)return false;
    if(chkZero&&d.vendasTotal===0&&d.estoque===0)return false;
    return true;
  });

  rows.sort(function(a,b){
    var av=a[sortCol], bv=b[sortCol];
    // Status tem ordem especial
    if(sortCol==='status'){
      var ord={critico:0,atencao:1,ok:2};
      av=ord[a.status]; bv=ord[b.status];
    }
    // Dias 999 = sem venda, sempre vai pro fim
    if((sortCol==='diasAteMin'||sortCol==='diasAteZero')){
      if(av>=999&&bv>=999)return 0;
      if(av>=999)return 1;
      if(bv>=999)return -1;
    }
    if(typeof av==='string') return sortDir*av.localeCompare(bv);
    return sortDir*((av||0)-(bv||0));
  });

  var tbody=document.getElementById('tbody');
  if(!tbody)return;
  if(!rows.length){tbody.innerHTML='<tr><td colspan="12" class="empty">Nenhum produto encontrado</td></tr>';return;}

  function badge(s){
    if(s==='critico')return'<span class="badge critico"><span class="dot"></span>Critico</span>';
    if(s==='atencao')return'<span class="badge atencao"><span class="dot"></span>Atencao</span>';
    return'<span class="badge ok"><span class="dot"></span>OK</span>';
  }

  // Mostra data real calculada pelos dias corridos
  function diasBadge(diasCorridos, diasUteis){
    if(diasCorridos===undefined||diasCorridos===null||diasCorridos>=999||diasCorridos<0)
      return'<span style="color:#ccc">-</span>';
    var d=new Date();d.setHours(0,0,0,0);
    d.setDate(d.getDate()+Math.floor(diasCorridos));
    var cls=diasCorridos<=7?'dias-r':diasCorridos<=30?'dias-a':'dias-g';
    var tooltip='em '+diasCorridos+' dias';
    if(diasUteis!==undefined)tooltip+=' ('+diasUteis+'du)';
    return'<span class="dias-badge '+cls+'" title="'+tooltip+'">'+fmtDate(dateToStr(d))+'</span>';
  }

  // Badge da data de prontidão com indicador se está a prazo
  function prodBadge(info, diasAteMin){
    if(!info)return'<span style="color:#ccc">-</span>';
    var dtStr=fmtDate(dateToStr(info.dataPronta));
    var cls=info.aPrazo?'dias-g':'dias-r';
    var aviso=info.aPrazo?'✓ a prazo':'⚠ atrasado';
    var tooltip='Producao finaliza: '+fmtDate(dateToStr(info.dataFimProducao))+
      ' | Pronto: '+dtStr+' ('+info.diasCorridos+'d corridos) | '+aviso;
    return'<span class="dias-badge '+cls+'" title="'+tooltip+'">'+dtStr+'</span>';
  }

  var html='';
  rows.forEach(function(d){
    var minLabel=d.estoqueMin>0?d.estoqueMin:'-';
    var customTag=d.customMin?' <span style="font-size:10px;color:#7c7af8">*</span>':'';
    var nomeEsc=d.nome.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    html+=
      '<tr>'+
      '<td>'+badge(d.status)+'</td>'+
      '<td><span class="tag">'+d.sku+'</span></td>'+
      '<td style="max-width:220px;cursor:pointer" onclick="toggleNome(this)" title="Clique para expandir">'+
      '<span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+d.nome+'</span>'+
      '</td>'+
      '<td style="color:#888;font-size:12px">'+d.categoria+'</td>'+
      '<td style="text-align:right">'+(d.vendas7d>0?'<strong>'+d.vendas7d+'</strong>':'<span style="color:#ccc">0</span>')+'</td>'+
      '<td style="text-align:right">'+d.vendasTotal+'</td>'+
      '<td style="text-align:right">'+(d.mediaDia>0?d.mediaDia.toFixed(2):'-')+'</td>'+
      '<td style="text-align:right;font-weight:600">'+d.estoque+'</td>'+
      '<td style="text-align:right">'+minLabel+customTag+' <button class="btn-edit" onclick="openEditMin(\''+d.sku+'\',\''+nomeEsc+'\')" title="Editar minimo">&#9998;</button></td>'+
      '<td>'+diasBadge(d.diasAteMin)+'</td>'+
      '<td>'+diasBadge(d.diasAteZero)+'</td>'+
      '<td>'+prodBadge(d.infoProd, d.diasAteMin)+'</td>'+
      '</tr>';
  });
  tbody.innerHTML=html;
}

// Expande/colapsa nome na célula
function toggleNome(td){
  var span=td.querySelector('span');
  if(!span)return;
  if(span.style.whiteSpace==='normal'){
    span.style.whiteSpace='nowrap';
    span.style.overflow='hidden';
    span.style.textOverflow='ellipsis';
    td.style.maxWidth='220px';
  } else {
    span.style.whiteSpace='normal';
    span.style.overflow='visible';
    span.style.textOverflow='unset';
    td.style.maxWidth='400px';
  }
}
